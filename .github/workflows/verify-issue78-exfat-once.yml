name: Verify Issue78 exFAT Once

on:
  push:
    branches:
      - hotfix/external-drive-link-fallback
    paths:
      - '.github/workflows/verify-issue78-exfat-once.yml'

permissions:
  contents: read

jobs:
  exfat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build candidate and mount exFAT test disk
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\launcher-source\v21\BUILD_LAUNCHER_1_1_4_ISSUE78_CANDIDATE.ps1' -OutputRoot "$env:RUNNER_TEMP\issue78-exfat-build" -LauncherVersion '1.1.4'

          $vhd='C:\issue78-exfat-test.vhd'
          $letter='R'
          $script = @(
            ('create vdisk file="{0}" maximum=256 type=expandable' -f $vhd),
            ('select vdisk file="{0}"' -f $vhd),
            'attach vdisk',
            'create partition primary',
            'format fs=exfat quick label=A8PTEST',
            ('assign letter={0}' -f $letter)
          ) -join [Environment]::NewLine
          $diskpart=Join-Path $env:RUNNER_TEMP 'issue78-diskpart.txt'
          [IO.File]::WriteAllText($diskpart,$script,[Text.Encoding]::ASCII)
          diskpart /s $diskpart | Write-Host
          if(-not (Test-Path "$letter`:\")){throw 'exFAT test volume did not mount'}
          $drive=New-Object IO.DriveInfo("$letter`:\")
          if($drive.DriveFormat -ne 'exFAT'){throw "expected exFAT, got $($drive.DriveFormat)"}
          Write-Host "EXFAT_VOLUME_READY=$($drive.Name)|$($drive.DriveFormat)"

          try {
            $exe="$env:RUNNER_TEMP\issue78-exfat-build\package\AotR 8P WotR Mod.exe"
            $asm=[Reflection.Assembly]::Load([IO.File]::ReadAllBytes($exe))
            $s=$asm.GetManifestResourceStream('AotR8P.EngineScript')
            $engine=Join-Path $env:RUNNER_TEMP 'issue78-exfat-engine.ps1'
            try{$o=[IO.File]::Create($engine);try{$s.CopyTo($o)}finally{$o.Dispose()}}finally{$s.Dispose()}
            $tokens=$null;$errors=$null
            $ast=[System.Management.Automation.Language.Parser]::ParseFile($engine,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw $errors[0].Message}
            $names=@('Get-AotR8PVolumeRoot','Get-AotR8PRuntimeStageRoot','New-LinkedFile','New-LinkedDirectory')
            $wanted=@{};foreach($n in $names){$wanted[$n]=$true}
            $funcs=@($ast.FindAll({param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $wanted.ContainsKey($n.Name)},$true))
            if($funcs.Count -ne $names.Count){throw "function extraction mismatch $($funcs.Count)"}
            $fnFile=Join-Path $env:RUNNER_TEMP 'issue78-exfat-functions.ps1'
            [IO.File]::WriteAllText($fnFile,(($funcs|ForEach-Object{$_.Extent.Text})-join "`r`n`r`n"),(New-Object Text.UTF8Encoding($false)))
            . $fnFile

            $install="$letter`:\AotR"
            $source=Join-Path $install 'aotr'
            New-Item -ItemType Directory -Force -Path $source | Out-Null
            $state='C:\A8P_Issue78_exFAT_State'
            $stage=Get-AotR8PRuntimeStageRoot $install $state
            $expected=[IO.Path]::GetFullPath((Join-Path $state 'runtime'))
            if($stage -ne $expected){throw "exFAT selector did not redirect local: $stage vs $expected"}
            if([IO.Path]::GetPathRoot($stage) -ieq "$letter`:\"){throw 'runtime remained on exFAT volume'}
            Write-Host "EXFAT_RUNTIME_REDIRECT_PASS=$stage"

            [IO.File]::WriteAllText((Join-Path $source 'probe.txt'),'exfat-file',[Text.Encoding]::UTF8)
            $runtime=Join-Path $stage '_AOTR_8P_WOTR_RUNTIME'
            New-Item -ItemType Directory -Force -Path $runtime | Out-Null
            New-LinkedFile (Join-Path $source 'probe.txt') (Join-Path $runtime 'probe.txt')
            if([IO.File]::ReadAllText((Join-Path $runtime 'probe.txt')) -ne 'exfat-file'){throw 'exFAT file staging failed'}

            $srcDir=Join-Path $source 'data'
            New-Item -ItemType Directory -Force -Path $srcDir | Out-Null
            [IO.File]::WriteAllText((Join-Path $srcDir 'dirprobe.txt'),'exfat-dir',[Text.Encoding]::UTF8)
            New-LinkedDirectory $srcDir (Join-Path $runtime 'data')
            if([IO.File]::ReadAllText((Join-Path $runtime 'data\dirprobe.txt')) -ne 'exfat-dir'){throw 'exFAT directory staging failed'}
            Write-Host 'EXFAT_END_TO_END_STAGING_PASS'
          }
          finally {
            Remove-Item -LiteralPath 'C:\A8P_Issue78_exFAT_State' -Recurse -Force -ErrorAction SilentlyContinue
            $detach = @(
              ('select vdisk file="{0}"' -f $vhd),
              'detach vdisk'
            ) -join [Environment]::NewLine
            [IO.File]::WriteAllText($diskpart,$detach,[Text.Encoding]::ASCII)
            diskpart /s $diskpart | Write-Host
            Remove-Item -LiteralPath $vhd -Force -ErrorAction SilentlyContinue
          }
