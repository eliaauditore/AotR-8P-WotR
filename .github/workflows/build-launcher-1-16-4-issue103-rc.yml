name: Build launcher 1.16.4 Issue103 RC

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'launcher-source/v27/**'
      - 'launcher-source/BUILD_AOTR_8P_SINGLE_EXE_UPDATE_CHANNEL_V27_FINAL_1_16_4.ps1'
      - '.github/workflows/build-launcher-1-16-4-issue103-rc.yml'
  workflow_dispatch:

jobs:
  build-issue103-rc:
    name: Build and verify Issue103 launcher 1.16.4 RC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build 1.16.4 candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'aotr-1.16.4-issue103-rc'
          & '.\launcher-source\BUILD_AOTR_8P_SINGLE_EXE_UPDATE_CHANNEL_V27_FINAL_1_16_4.ps1' -OutputRoot $out
          if ($LASTEXITCODE -ne 0) { throw "V27 builder failed with exit code $LASTEXITCODE" }
          $exe = Join-Path $out 'package\AotR 8P WotR Mod.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw '1.16.4 candidate EXE missing' }
          $fvi = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($fvi.ProductVersion -ne '1.16.4') { throw "ProductVersion mismatch: $($fvi.ProductVersion)" }
          if ($fvi.FileVersion -ne '1.16.4.0') { throw "FileVersion mismatch: $($fvi.FileVersion)" }
          "ISSUE103_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ISSUE103_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ISSUE103_CANDIDATE_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash)"

      - name: Extract and verify embedded resources
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $asm = [Reflection.Assembly]::Load([IO.File]::ReadAllBytes($env:ISSUE103_EXE))
          $root = Join-Path $env:RUNNER_TEMP 'issue103-resources'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach ($item in @(
            @{ Name='AotR8P.GuiScript'; File='gui.ps1' },
            @{ Name='AotR8P.EngineScript'; File='engine.ps1' },
            @{ Name='AotR8P.FinalStableV7'; File='final_stable_v7.ps1'; Hash='F16522820D7B25CDD4ACF1267B8A300C6BFE661C7FEF636BB611819F7BDC84D3' },
            @{ Name='AotR8P.V7Shellcode'; File='v7_shellcode.bin'; Hash='60EECE4660C3BA0AD183EB82B82DCDACF3ECA6DC892C8FAFCD629A92170ED45A' }
          )) {
            $stream = $asm.GetManifestResourceStream($item.Name)
            if (-not $stream) { throw "$($item.Name) missing from candidate" }
            $target = Join-Path $root $item.File
            try {
              $out = [IO.File]::Create($target)
              try { $stream.CopyTo($out) } finally { $out.Dispose() }
            } finally { $stream.Dispose() }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash
            if ($item.Hash -and $hash -ne $item.Hash) { throw "$($item.Name) changed unexpectedly: $hash" }
            Write-Host "ISSUE103_RESOURCE_SHA256 :: $($item.Name) :: $hash"
          }

          foreach ($script in @('gui.ps1','engine.ps1','final_stable_v7.ps1')) {
            $path = Join-Path $root $script
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if (@($errors).Count -gt 0) { throw "PowerShell 5.1 parse failed: $script :: $($errors[0].Message)" }
          }

          $engine = [IO.File]::ReadAllText((Join-Path $root 'engine.ps1'))
          foreach ($required in @(
            'AOTR8P_ERROR_MESSAGE_B64=',
            'AOTR8P_DIAG_JSON=',
            'kind = "gameproc_early_exit"',
            'process_exit_code = $exitCodeText',
            'observed_ms = [Int64]$observedMs',
            'runtime_location = $runtimeLocation',
            'runtime_sha256 =',
            'wer_signal =',
            'throw "game.dat exited during initialization."'
          )) {
            if ($engine.IndexOf($required,[StringComparison]::Ordinal) -lt 0) { throw "Issue103 Engine contract missing: $required" }
          }

          $gui = [IO.File]::ReadAllText((Join-Path $root 'gui.ps1'))
          foreach ($required in @(
            'function Get-EngineFailureDetailFromLog',
            'function Get-StructuredEngineDiagnosticFromLog',
            'process_exit_code = $(if ($processDiag)',
            'observed_ms = $(if ($processDiag -and',
            'runtime_location = $(if ($processDiag)',
            'runtime_sha256 = $(if ($processDiag)',
            'wer_signal = $(if ($processDiag)',
            'AOTR8P_ERROR_MESSAGE_B64',
            'AOTR8P_DIAG_JSON',
            'Launcher 1.16.4'
          )) {
            if ($gui.IndexOf($required,[StringComparison]::Ordinal) -lt 0) { throw "Issue103 GUI contract missing: $required" }
          }
          if ($gui.IndexOf('Select-Object -Last 8',[StringComparison]::Ordinal) -ge 0) { throw 'Legacy Last-8 engine-error truncation is still present' }

          "ISSUE103_RESOURCE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ISSUE103_ENGINE_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $root 'engine.ps1')).Hash)"
          Write-Host "ISSUE103_GUI_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $root 'gui.ps1')).Hash)"
          Write-Host 'ISSUE103_RESOURCE_BOUNDARY_GATE=PASS'

      - name: Execute synthetic Engine-to-GUI diagnostic transport
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $guiPath = Join-Path $env:ISSUE103_RESOURCE_ROOT 'gui.ps1'
          $tokens=$null; $errors=$null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($guiPath,[ref]$tokens,[ref]$errors)
          if (@($errors).Count -gt 0) { throw 'GUI parse failed before function extraction' }

          function Import-GuiFunction([string]$Name) {
            $fn = @($ast.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $Name
            }, $true))
            if ($fn.Count -ne 1) { throw "Expected one GUI function $Name, got $($fn.Count)" }
            Invoke-Expression $fn[0].Extent.Text
          }
          function Get-SanitizedText([string]$Text) { return [string]$Text }
          function Limit-SupportText([string]$Text,[int]$MaxLength = 3000) {
            $value = [string]$Text
            if ($value.Length -le $MaxLength) { return $value }
            return $value.Substring(0,$MaxLength)
          }
          function Write-RepairLog([string]$Text) { Write-Host "TEST_LOG: $Text" }

          Import-GuiFunction 'Get-EngineFailureDetailFromLog'
          Import-GuiFunction 'Get-StructuredEngineDiagnosticFromLog'
          Import-GuiFunction 'Get-LaunchFailureInfo'

          $human = 'game.dat exited during initialization.'
          $humanB64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($human))
          $runtimeSha = 'CC08275D60FF8E3BFD4374C29D61304DEA8336E6DD00AB8ADD88B1DF95A705DC'
          $diagJson = '{"schema":2,"kind":"gameproc_early_exit","process_exit_code":"0xC0000005/-1073741819","observed_ms":2134,"runtime_location":"LOCALAPPDATA","runtime_sha256":"' + $runtimeSha + '","wer_signal":"Application Error/1000/exception=c0000005/module=game.dat"}'
          $synthetic = @(
            'PowerShell transcript header',
            'LAUNCHER-FEHLER',
            'game.dat exited during initialization.',
            'POSITION:',
            'At line:751 char:9',
            'STACK:',
            'at <ScriptBlock>',
            ("AOTR8P_ERROR_MESSAGE_B64=" + $humanB64),
            ("AOTR8P_DIAG_JSON=" + $diagJson),
            'AOTR8P_ENGINE_EXIT=1'
          ) -join [Environment]::NewLine

          $detail = Get-EngineFailureDetailFromLog $synthetic
          if ($detail -ne $human) { throw "Machine-readable human error roundtrip failed: $detail" }

          $diag = Get-StructuredEngineDiagnosticFromLog $synthetic
          if ($null -eq $diag) { throw 'Structured diagnostic was not recovered' }
          if ([string]$diag.process_exit_code -ne '0xC0000005/-1073741819') { throw "exit code mismatch: $($diag.process_exit_code)" }
          if ([Int64]$diag.observed_ms -ne 2134) { throw "observed_ms mismatch: $($diag.observed_ms)" }
          if ([string]$diag.runtime_location -ne 'LOCALAPPDATA') { throw "runtime_location mismatch: $($diag.runtime_location)" }
          if ([string]$diag.runtime_sha256 -ne $runtimeSha) { throw "runtime_sha256 mismatch: $($diag.runtime_sha256)" }
          if ([string]$diag.wer_signal -ne 'Application Error/1000/exception=c0000005/module=game.dat') { throw "WER signal mismatch: $($diag.wer_signal)" }

          $classification = Get-LaunchFailureInfo $detail
          if ([string]$classification.Code -ne 'A8P-GAMEPROC-001') { throw "English early-exit misclassified as $($classification.Code)" }

          Write-Host 'ISSUE103_ENGINE_TO_GUI_ROUNDTRIP=PASS'
          Write-Host 'ISSUE103_GAMEPROC_CLASSIFICATION=PASS'

      - name: Verify support-bundle schema 2 producer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $gui = [IO.File]::ReadAllText((Join-Path $env:ISSUE103_RESOURCE_ROOT 'gui.ps1'))
          if ($gui -notmatch '(?s)function New-SupportBundle.*?schema\s*=\s*2') { throw 'New-SupportBundle is not schema 2' }
          foreach ($field in @('process_exit_code','observed_ms','runtime_location','runtime_sha256','wer_signal')) {
            if ($gui -notmatch ('(?m)^\s*' + [regex]::Escape($field) + '\s*=')) { throw "Support-bundle structured field missing: $field" }
          }
          if ($gui -notmatch '(?s)function Send-LauncherReport.*?\$payload\s*=\s*\[ordered\]@\{\s*schema\s*=\s*2') { throw 'Direct-report request schema did not advance to 2' }
          Write-Host 'ISSUE103_SUPPORT_BUNDLE_SCHEMA2_GATE=PASS'

      - name: Defender scan exact 1.16.4 candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = $env:ISSUE103_EXE
          $mp = @(
            "$env:ProgramFiles\Windows Defender\MpCmdRun.exe",
            "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe"
          ) | ForEach-Object { Get-Item $_ -ErrorAction SilentlyContinue } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mp) { throw 'MpCmdRun.exe not found on hosted runner' }
          & $mp.FullName -Scan -ScanType 3 -File $exe -DisableRemediation
          if ($LASTEXITCODE -notin @(0,2)) { throw "Defender scan failed with exit code $LASTEXITCODE" }
          $threats = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.Resources -match [regex]::Escape($exe) })
          if ($threats.Count -gt 0) { throw 'Defender detected launcher 1.16.4 Issue103 candidate' }
          Write-Host 'ISSUE103_1_16_4_DEFENDER=SCANNED_CLEAN'

      - name: Upload Issue103 RC
        uses: actions/upload-artifact@v4
        with:
          name: AotR-launcher-1.16.4-Issue103-RC
          path: |
            ${{ env.ISSUE103_OUT }}/package/AotR 8P WotR Mod.exe
            ${{ env.ISSUE103_OUT }}/package/manifest.json
            ${{ env.ISSUE103_OUT }}/package/repair-manifest.json
            ${{ env.ISSUE103_OUT }}/SHA256SUMS.json
            ${{ env.ISSUE103_OUT }}/DEFENDER_SCAN.txt
          if-no-files-found: error
