name: Build Launcher 1.1.8 Issue84 Session RC2 Final

on:
  push:
    branches:
      - hotfix/runtime-session-temp-1.1.8-rc2
    paths:
      - 'launcher-source/v25/**'
      - 'launcher-source/v26/**'
      - '.github/workflows/build-launcher-1-1-8-issue84-session-rc2-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify frozen public release boundary
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content -LiteralPath '.\manifest.json' -Raw | ConvertFrom-Json
          if($manifest.launcher_version -ne '1.1.6'){throw "Public manifest moved unexpectedly: $($manifest.launcher_version)"}
          $publicHash=(Get-FileHash -LiteralPath '.\AotR 8P WotR Mod.exe' -Algorithm SHA256).Hash
          if($publicHash -ne 'E5FD1761FB84E452782AFD970225775CB55096C22628F1B9061344C282861431'){
            throw "Frozen public 1.1.6 EXE changed: $publicHash"
          }
          Write-Host 'ISSUE84_RC2_PUBLIC_1_1_6_BOUNDARY=PASS'

      - name: Parse final RC2 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile `
            '.\launcher-source\v26\apply_issue84_session_runtime_rc2_hardening.py' `
            '.\launcher-source\v26\apply_issue84_session_runtime_rc2_hardening_v2.py'
          if($LASTEXITCODE -ne 0){throw 'RC2 Python parse failed'}
          foreach($builder in @(
            '.\launcher-source\v26\BUILD_LAUNCHER_1_1_8_ISSUE84_SESSION_RC2.ps1',
            '.\launcher-source\v26\BUILD_LAUNCHER_1_1_8_ISSUE84_SESSION_RC2_FINAL.ps1'
          )){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $builder),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "PS5.1 parse failure: $builder :: $($errors[0].Message)"}
          }
          Write-Host 'ISSUE84_RC2_FINAL_SOURCE_PARSE=PASS'

      - name: Build final 1.1.8 RC2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\launcher-source\v26\BUILD_LAUNCHER_1_1_8_ISSUE84_SESSION_RC2_FINAL.ps1' `
            -OutputRoot '.\_V26_1_1_8_RC2_FINAL_BUILD'
          if($LASTEXITCODE -ne 0){throw "Final RC2 builder failed with exit code $LASTEXITCODE"}

      - name: Validate generated lifecycle contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $engine=(Resolve-Path '.\_V26_1_1_8_RC2_FINAL_BUILD\work\resources\launcher_engine.ps1').Path
          $gui=(Resolve-Path '.\_V26_1_1_8_RC2_FINAL_BUILD\work\resources\launcher_gui.ps1').Path
          $cs=(Resolve-Path '.\_V26_1_1_8_RC2_FINAL_BUILD\work\launcher_v26.cs').Path
          foreach($path in @($engine,$gui)){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "PS5.1 generated parse failure: $path :: $($errors[0].Message)"}
          }
          $engineText=[IO.File]::ReadAllText($engine)
          $guiText=[IO.File]::ReadAllText($gui)
          $csText=[IO.File]::ReadAllText($cs)

          foreach($needle in @(
            '$runtimeRoot = Join-Path $stateRootFull "runtime"',
            '$sessionRoot = Join-Path $runtimeRoot "sessions"',
            'schema = 2',
            'launcher_start_utc_ticks',
            'game_launcher_start_utc_ticks',
            'game_start_utc_ticks',
            '--cleanup-runtime-watch',
            'ReparsePoint'
          )){
            if(-not $engineText.Contains($needle)){throw "RC2 engine contract missing: $needle"}
          }
          if($engineText.Contains('schema = 1')){throw 'RC1 marker schema remains'}
          if($engineText.Contains('Join-Path $runtimeStageRoot ("_AOTR_8P_WOTR_RUNTIME_V4_" + $PID)')){throw 'Legacy V4 runtime creation remains'}
          if($engineText.Contains('__A8P_RC2_RUNTIME_SESSIONS_SENTINEL__')){throw 'Source-only RC2 sentinel leaked into generated engine'}

          foreach($needle in @('--cleanup-runtime-stale','Remove-AotR8PLegacyRuntimeFolders')){
            if(-not $guiText.Contains($needle)){throw "RC2 GUI contract missing: $needle"}
          }
          foreach($forbidden in @('"--cleanup-runtime",','Move-Item -LiteralPath $runtimePath -Destination $quarantine','$leaf + "_REPAIR_"')){
            if($guiText.Contains($forbidden)){throw "Unsafe/persistent RC1 primitive remains: $forbidden"}
          }

          foreach($needle in @(
            'RunRuntimeCleanupWatch',
            'RunRuntimeCleanupStale',
            'TryReadRuntimeSessionMarker',
            'IsRecordedProcessAlive',
            'RuntimeSessionRootComponentsSafe',
            'CanDeleteRuntimeSessionNow',
            'RuntimeLifecycleSelfTest',
            'Path.GetDirectoryName(full)',
            'HasRuntimeSessionForUpdateDeferral',
            'Update deferred while a transient runtime session or cleanup watcher is active.'
          )){
            if(-not $csText.Contains($needle)){throw "RC2 C# contract missing: $needle"}
          }
          foreach($forbidden in @('RunRuntimeCleanupHelper','WaitForPidExit','String.Equals(args[0], "--cleanup-runtime",')){
            if($csText.Contains($forbidden)){throw "RC1 weak lifecycle primitive remains: $forbidden"}
          }
          Write-Host 'ISSUE84_RC2_FINAL_GENERATED_CONTRACT=PASS'

      - name: Execute built-in lifecycle self-test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path '.\_V26_1_1_8_RC2_FINAL_BUILD\package\AotR 8P WotR Mod.exe').Path
          $p=Start-Process -FilePath $exe -ArgumentList '--runtime-lifecycle-selftest' -WindowStyle Hidden -PassThru -Wait
          if($p.ExitCode -ne 0){throw "Runtime lifecycle self-test failed with exit code $($p.ExitCode)"}
          Write-Host 'ISSUE84_RC2_FINAL_BUILTIN_SELFTEST=PASS'

      - name: Exercise stale and watcher lifecycle modes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $exe=(Resolve-Path '.\_V26_1_1_8_RC2_FINAL_BUILD\package\AotR 8P WotR Mod.exe').Path
          $sessions=Join-Path $env:LOCALAPPDATA 'AotR 8P WotR Mod\runtime\sessions'
          New-Item -ItemType Directory -Force -Path $sessions | Out-Null

          function Write-Marker([string]$Path,[string]$SessionId,[int]$LauncherPid,[long]$LauncherTicks,[int]$GameLauncherPid=0,[long]$GameLauncherTicks=0,[int]$GamePid=0,[long]$GameTicks=0){
            $obj=[ordered]@{
              schema=2
              session_id=$SessionId
              launcher_pid=$LauncherPid
              launcher_start_utc_ticks=$LauncherTicks
              game_launcher_pid=$GameLauncherPid
              game_launcher_start_utc_ticks=$GameLauncherTicks
              game_pid=$GamePid
              game_start_utc_ticks=$GameTicks
              updated_utc=[DateTime]::UtcNow.ToString('o')
            }
            $json=$obj | ConvertTo-Json -Depth 3
            [IO.File]::WriteAllText((Join-Path $Path 'AOTR8P_SESSION.json'),$json,(New-Object Text.UTF8Encoding($false)))
          }

          function Invoke-Stale([string]$Path){
            $p=Start-Process -FilePath $exe -ArgumentList ('--cleanup-runtime-stale "' + $Path + '"') -WindowStyle Hidden -PassThru -Wait
            return $p.ExitCode
          }

          # A live exact PID+StartTime identity must be protected from Auto-Repair/stale cleanup.
          $self=Get-Process -Id $PID
          $selfTicks=[long]$self.StartTime.ToUniversalTime().Ticks
          $activeId='AOTR8P_SESSION_' + $PID + '_' + [Guid]::NewGuid().ToString('N')
          $activePath=Join-Path $sessions $activeId
          New-Item -ItemType Directory -Path $activePath | Out-Null
          Write-Marker $activePath $activeId $PID $selfTicks
          $exit=Invoke-Stale $activePath
          if($exit -ne 5 -or -not (Test-Path -LiteralPath $activePath -PathType Container)){
            throw "Active session was not protected. exit=$exit"
          }
          Remove-Item -LiteralPath $activePath -Recurse -Force
          Write-Host 'ISSUE84_RC2_ACTIVE_SESSION_PROTECTION=PASS'

          # Same PID with a mismatching creation time must NOT be treated as the recorded process.
          $reuseId='AOTR8P_SESSION_' + $PID + '_' + [Guid]::NewGuid().ToString('N')
          $reusePath=Join-Path $sessions $reuseId
          New-Item -ItemType Directory -Path $reusePath | Out-Null
          Write-Marker $reusePath $reuseId $PID ($selfTicks + ([TimeSpan]::TicksPerSecond * 30L))
          $exit=Invoke-Stale $reusePath
          if($exit -ne 0 -or (Test-Path -LiteralPath $reusePath)){
            throw "PID-reuse resistance failed. exit=$exit"
          }
          Write-Host 'ISSUE84_RC2_PID_REUSE_RESISTANCE=PASS'

          # A fresh malformed marker is retained; after the conservative age gate it becomes removable.
          $deadPid=2147483000
          $badId='AOTR8P_SESSION_' + $deadPid + '_' + [Guid]::NewGuid().ToString('N')
          $badPath=Join-Path $sessions $badId
          New-Item -ItemType Directory -Path $badPath | Out-Null
          [IO.File]::WriteAllText((Join-Path $badPath 'AOTR8P_SESSION.json'),'{broken-json',(New-Object Text.UTF8Encoding($false)))
          $exit=Invoke-Stale $badPath
          if($exit -ne 5 -or -not (Test-Path -LiteralPath $badPath -PathType Container)){
            throw "Fresh malformed marker was not retained. exit=$exit"
          }
          [IO.Directory]::SetLastWriteTimeUtc($badPath,[DateTime]::UtcNow.AddMinutes(-31))
          $exit=Invoke-Stale $badPath
          if($exit -ne 0 -or (Test-Path -LiteralPath $badPath)){
            throw "Aged malformed stale session was not removed. exit=$exit"
          }
          Write-Host 'ISSUE84_RC2_INVALID_MARKER_GRACE=PASS'

          # Nested valid-looking paths are outside the direct-child boundary and must be rejected.
          $outer=Join-Path $sessions 'nested-container'
          $nestedId='AOTR8P_SESSION_' + $deadPid + '_' + [Guid]::NewGuid().ToString('N')
          $nested=Join-Path $outer $nestedId
          New-Item -ItemType Directory -Force -Path $nested | Out-Null
          $exit=Invoke-Stale $nested
          if($exit -ne 3 -or -not (Test-Path -LiteralPath $nested -PathType Container)){
            throw "Nested path boundary failed. exit=$exit"
          }
          Remove-Item -LiteralPath $outer -Recurse -Force
          Write-Host 'ISSUE84_RC2_DIRECT_CHILD_BOUNDARY=PASS'

          # A watcher must hold the session while its recorded process is alive and delete after exit.
          $dummy=Start-Process -FilePath 'powershell.exe' -ArgumentList '-NoProfile -WindowStyle Hidden -Command "Start-Sleep -Seconds 4"' -WindowStyle Hidden -PassThru
          Start-Sleep -Milliseconds 300
          $dummy.Refresh()
          $dummyTicks=[long]$dummy.StartTime.ToUniversalTime().Ticks
          $watchId='AOTR8P_SESSION_' + $dummy.Id + '_' + [Guid]::NewGuid().ToString('N')
          $watchPath=Join-Path $sessions $watchId
          New-Item -ItemType Directory -Path $watchPath | Out-Null
          Write-Marker $watchPath $watchId $dummy.Id $dummyTicks
          $watcher=Start-Process -FilePath $exe -ArgumentList ('--cleanup-runtime-watch "' + $watchPath + '"') -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 1
          $watcher.Refresh()
          if($watcher.HasExited -or -not (Test-Path -LiteralPath $watchPath -PathType Container)){
            throw 'Cleanup watcher did not retain active session.'
          }
          $dummy.WaitForExit()
          if(-not $watcher.WaitForExit(20000)){try{$watcher.Kill()}catch{};throw 'Cleanup watcher did not finish after recorded process exit.'}
          if($watcher.ExitCode -ne 0 -or (Test-Path -LiteralPath $watchPath)){
            throw "Cleanup watcher did not delete ended session. exit=$($watcher.ExitCode)"
          }
          Write-Host 'ISSUE84_RC2_WATCHER_LIFECYCLE=PASS'

          # Session-root reparse points must never be followed/deleted recursively.
          $target=Join-Path $env:RUNNER_TEMP ('issue84-junction-target-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $target | Out-Null
          $junctionId='AOTR8P_SESSION_' + $deadPid + '_' + [Guid]::NewGuid().ToString('N')
          Write-Marker $target $junctionId $deadPid 1
          $junction=Join-Path $sessions $junctionId
          New-Item -ItemType Junction -Path $junction -Target $target | Out-Null
          $exit=Invoke-Stale $junction
          if($exit -ne 4 -or -not (Test-Path -LiteralPath $junction) -or -not (Test-Path -LiteralPath $target -PathType Container)){
            throw "Reparse no-follow safety failed. exit=$exit"
          }
          [IO.Directory]::Delete($junction,$false)
          Remove-Item -LiteralPath $target -Recurse -Force
          Write-Host 'ISSUE84_RC2_REPARSE_NO_FOLLOW=PASS'

      - name: Verify candidate identity and hosted Defender
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path '.\_V26_1_1_8_RC2_FINAL_BUILD\package\AotR 8P WotR Mod.exe').Path
          $fvi=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if($fvi.ProductVersion -ne '1.1.8'){throw "ProductVersion=$($fvi.ProductVersion)"}
          $hash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          Write-Host "ISSUE84_SESSION_RC2_FINAL_EXE_SHA256=$hash"

          $zip=(Get-ChildItem -LiteralPath '.\_V26_1_1_8_RC2_FINAL_BUILD' -Filter '*.zip' -File | Select-Object -First 1)
          if(-not $zip){throw 'RC2 final ZIP missing'}
          $zipHash=(Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash
          Write-Host "ISSUE84_SESSION_RC2_FINAL_ZIP_SHA256=$zipHash"

          $mp=@(
            "$env:ProgramFiles\Windows Defender\MpCmdRun.exe",
            "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe"
          ) | ForEach-Object { Get-Item $_ -ErrorAction SilentlyContinue } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $mp){throw 'Windows Defender MpCmdRun.exe unavailable'}
          & $mp.FullName -Scan -ScanType 3 -File $exe -DisableRemediation
          if($LASTEXITCODE -ne 0){throw "Hosted Defender scan exit=$LASTEXITCODE"}
          Write-Host 'ISSUE84_SESSION_RC2_FINAL_HOSTED_DEFENDER=PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: AotR-1.1.8-Issue84-Session-RC2-Final
          path: |
            _V26_1_1_8_RC2_FINAL_BUILD/package/**
            _V26_1_1_8_RC2_FINAL_BUILD/SHA256SUMS.json
            _V26_1_1_8_RC2_FINAL_BUILD/*.zip
            _V26_1_1_8_RC2_FINAL_BUILD/*.sha256.txt
            _V26_1_1_8_RC2_FINAL_BUILD/DEFENDER_SCAN.txt
          if-no-files-found: error
          retention-days: 90
