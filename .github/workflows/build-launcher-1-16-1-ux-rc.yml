name: Verify launcher 1.16.1 public

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'launcher-source/v24/**'
      - 'launcher-source/v25/**'
      - 'launcher-source/BUILD_AOTR_8P_SINGLE_EXE_UPDATE_CHANNEL_V25_FINAL_1_16_2.ps1'
      - 'launcher-source/BUILD_AOTR_8P_SINGLE_EXE_UPDATE_CHANNEL_V24_FINAL_1_16_1.ps1'
      - 'AotR 8P WotR Mod.exe'
      - 'manifest.json'
      - 'repair-manifest.json'
      - '.github/workflows/build-launcher-1-16-1-ux-rc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify promoted public identity and embedded boundaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $public = (Resolve-Path '.\AotR 8P WotR Mod.exe').Path
          $manifest = Get-Content -LiteralPath '.\manifest.json' -Raw | ConvertFrom-Json
          $repair = Get-Content -LiteralPath '.\repair-manifest.json' -Raw | ConvertFrom-Json

          if ([string]$manifest.launcher_version -ne '1.16.1') {
            throw "Public manifest is not 1.16.1: $($manifest.launcher_version)"
          }
          if ([string]$repair.generated_for_launcher -ne '1.16.1') {
            throw "repair-manifest is not for 1.16.1: $($repair.generated_for_launcher)"
          }

          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $public).Hash
          $expected = ([string]$manifest.launcher_sha256).ToUpperInvariant()
          if ($actual -ne $expected) {
            throw "Public EXE / manifest hash mismatch: expected $expected got $actual"
          }
          if ($actual -ne 'E4362F15DB47F1298B62C63F44C09AF5E41C07BD460FAE949609A5DB16D8F64C') {
            throw "Unexpected promoted 1.16.1 binary identity: $actual"
          }

          $fvi = [Diagnostics.FileVersionInfo]::GetVersionInfo($public)
          if ($fvi.ProductVersion -ne '1.16.1') { throw "ProductVersion mismatch: $($fvi.ProductVersion)" }
          if ($fvi.FileVersion -ne '1.16.1.0') { throw "FileVersion mismatch: $($fvi.FileVersion)" }

          $asm = [Reflection.Assembly]::Load([IO.File]::ReadAllBytes($public))
          $tmp = Join-Path $env:RUNNER_TEMP 'verify-public-1.16.1'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $resources = @(
            @{ Name='AotR8P.GuiScript'; File='gui.ps1'; Hash='222B5DC9EC8B787BF11B2913601FDB06C277EB20697488DDF034852E3F253B70' },
            @{ Name='AotR8P.EngineScript'; File='engine.ps1'; Hash='E9E2452FF56A66D57FF63C0B1654CFE0C856F4D5FA66C558E8F237C9ABABF641' },
            @{ Name='AotR8P.FinalStableV7'; File='final_stable_v7.ps1'; Hash='72D00490538BE2222F5BAAF3D8A1648A86071D3A098946A7B8751E7D337300E2' },
            @{ Name='AotR8P.V7Shellcode'; File='v7_shellcode.bin'; Hash='60EECE4660C3BA0AD183EB82B82DCDACF3ECA6DC892C8FAFCD629A92170ED45A' }
          )
          foreach ($item in $resources) {
            $stream = $asm.GetManifestResourceStream($item.Name)
            if (-not $stream) { throw "$($item.Name) missing from public EXE" }
            $target = Join-Path $tmp $item.File
            try {
              $out = [IO.File]::Create($target)
              try { $stream.CopyTo($out) } finally { $out.Dispose() }
            } finally { $stream.Dispose() }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash
            if ($hash -ne $item.Hash) { throw "$($item.Name) public hash mismatch: $hash" }
            Write-Host "RESOURCE_PASS :: $($item.Name) :: $hash"
          }

          foreach ($script in @('gui.ps1','engine.ps1','final_stable_v7.ps1')) {
            $path = Join-Path $tmp $script
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if (@($errors).Count -gt 0) { throw "PowerShell 5.1 parse failed: $script :: $($errors[0].Message)" }
          }

          $gui = [IO.File]::ReadAllText((Join-Path $tmp 'gui.ps1'))
          foreach ($required in @(
            'x:Name="ChangelogHit"',
            'function Show-LauncherChangelog {',
            '[System.Media.SystemSounds]::Asterisk.Play()',
            '$previousLatestMessageId',
            '$ChangelogHit.Add_MouseLeftButtonUp({ Show-LauncherChangelog })',
            'Launcher 1.16.1',
            'A8P-RUNTIME-FS-001'
          )) {
            if ($gui.IndexOf($required,[StringComparison]::Ordinal) -lt 0) {
              throw "Public GUI contract missing: $required"
            }
          }

          Write-Host "PUBLIC_1_16_1_IDENTITY=PASS :: $actual"
          Write-Host "PRODUCT_VERSION=$($fvi.ProductVersion)"
          Write-Host "FILE_VERSION=$($fvi.FileVersion)"

      - name: Defender scan of exact promoted public EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path '.\AotR 8P WotR Mod.exe').Path
          $mp = @(
            "$env:ProgramFiles\Windows Defender\MpCmdRun.exe",
            "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe"
          ) | ForEach-Object { Get-Item $_ -ErrorAction SilentlyContinue } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mp) { throw 'MpCmdRun.exe not found on hosted runner' }
          & $mp.FullName -Scan -ScanType 3 -File $exe -DisableRemediation
          if ($LASTEXITCODE -notin @(0,2)) { throw "Defender scan failed with exit code $LASTEXITCODE" }
          $threats = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.Resources -match [regex]::Escape($exe) })
          if ($threats.Count -gt 0) {
            $threats | Format-List *
            throw 'Defender detected the exact promoted public 1.16.1 EXE'
          }
          Write-Host 'PUBLIC_1_16_1_DEFENDER=SCANNED_CLEAN'

      - name: Classification
        shell: powershell
        run: |
          Write-Host 'PUBLIC_RELEASE_REVIEW_PASS'


  build-issue97-rc:
    name: Build Issue97 launcher 1.16.2 RC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build 1.16.2 Issue97 candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'aotr-1.16.2-issue97-rc'
          & '.\launcher-source\BUILD_AOTR_8P_SINGLE_EXE_UPDATE_CHANNEL_V25_FINAL_1_16_2.ps1' -OutputRoot $out
          if ($LASTEXITCODE -ne 0) { throw "V25 builder failed with exit code $LASTEXITCODE" }
          $exe = Join-Path $out 'package\AotR 8P WotR Mod.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw '1.16.2 candidate EXE missing' }
          $fvi = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($fvi.ProductVersion -ne '1.16.2') { throw "ProductVersion mismatch: $($fvi.ProductVersion)" }
          if ($fvi.FileVersion -ne '1.16.2.0') { throw "FileVersion mismatch: $($fvi.FileVersion)" }
          "ISSUE97_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ISSUE97_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ISSUE97_CANDIDATE_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash)"

      - name: Verify 1.16.2 embedded contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = $env:ISSUE97_EXE
          $asm = [Reflection.Assembly]::Load([IO.File]::ReadAllBytes($exe))
          $tmp = Join-Path $env:RUNNER_TEMP 'issue97-resources'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          foreach ($item in @(
            @{ Name='AotR8P.GuiScript'; File='gui.ps1' },
            @{ Name='AotR8P.EngineScript'; File='engine.ps1' },
            @{ Name='AotR8P.FinalStableV7'; File='final_stable_v7.ps1' },
            @{ Name='AotR8P.V7Shellcode'; File='v7_shellcode.bin' }
          )) {
            $stream = $asm.GetManifestResourceStream($item.Name)
            if (-not $stream) { throw "$($item.Name) missing from candidate" }
            $target = Join-Path $tmp $item.File
            try {
              $out = [IO.File]::Create($target)
              try { $stream.CopyTo($out) } finally { $out.Dispose() }
            } finally { $stream.Dispose() }
          }
          foreach ($script in @('gui.ps1','engine.ps1','final_stable_v7.ps1')) {
            $path = Join-Path $tmp $script
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if (@($errors).Count -gt 0) { throw "PS5.1 parse failed: $script :: $($errors[0].Message)" }
          }
          $engine = [IO.File]::ReadAllText((Join-Path $tmp 'engine.ps1'))
          foreach ($required in @(
            'AddParameter("TargetPid", [int]$GamePid)',
            '$invokeError = $_',
            'FINAL_STABLE_V7 In-Memory PowerShell failed: $detail'
          )) {
            if ($engine.IndexOf($required,[StringComparison]::Ordinal) -lt 0) { throw "Issue97 engine contract missing: $required" }
          }
          $final = [IO.File]::ReadAllText((Join-Path $tmp 'final_stable_v7.ps1'))
          foreach ($required in @(
            '[int]$TargetPid = 0',
            'if ($TargetPid -gt 0)',
            'Launcher-bound game.dat PID verwendet',
            '$target = Get-RunningTarget $GameDat'
          )) {
            if ($final.IndexOf($required,[StringComparison]::Ordinal) -lt 0) { throw "Issue97 V7 contract missing: $required" }
          }
          $gui = [IO.File]::ReadAllText((Join-Path $tmp 'gui.ps1'))
          if ($gui.IndexOf('Launcher 1.16.2',[StringComparison]::Ordinal) -lt 0) { throw '1.16.2 changelog entry missing' }
          "ISSUE97_RESOURCE_ROOT=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ISSUE97_GUI_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $tmp 'gui.ps1')).Hash)"
          Write-Host "ISSUE97_ENGINE_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $tmp 'engine.ps1')).Hash)"
          Write-Host "ISSUE97_FINAL_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $tmp 'final_stable_v7.ps1')).Hash)"
          Write-Host "ISSUE97_SHELLCODE_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $tmp 'v7_shellcode.bin')).Hash)"

      - name: Prove exact PID binding bypasses legacy path rediscovery
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:ISSUE97_RESOURCE_ROOT
          $v7Text = [IO.File]::ReadAllText((Join-Path $root 'final_stable_v7.ps1'))
          [byte[]]$shellcode = [IO.File]::ReadAllBytes((Join-Path $root 'v7_shellcode.bin'))
          $dummyGameDat = Join-Path $env:RUNNER_TEMP 'issue97-dummy-game.dat'
          [IO.File]::WriteAllBytes($dummyGameDat, [byte[]](0..255))
          $child = [PowerShell]::Create()
          $caught = $null
          try {
            [void]$child.AddScript($v7Text)
            [void]$child.AddParameter('GameDat', $dummyGameDat)
            [void]$child.AddParameter('AnchorGain', [single]2.0)
            [void]$child.AddParameter('DragSpeed', [single]-16.0)
            [void]$child.AddParameter('V7Shellcode', $shellcode)
            [void]$child.AddParameter('TargetPid', [int]$PID)
            try { $null = $child.Invoke() } catch { $caught = [string]$_.Exception.Message }
            if ($child.HadErrors) {
              $streamDetail = ($child.Streams.Error | ForEach-Object { $_.ToString() }) -join ' | '
              if (-not [string]::IsNullOrWhiteSpace($streamDetail)) { $caught = $streamDetail }
            }
          }
          finally { $child.Dispose() }
          if ([string]::IsNullOrWhiteSpace($caught)) { throw 'Synthetic PID-binding proof unexpectedly reached the write path.' }
          if ($caught -match 'passende game\.dat laeuft noch nicht') { throw "Legacy path rediscovery is still active: $caught" }
          if ($caught -match 'game\.dat nicht gefunden') { throw "PID proof failed before process binding: $caught" }
          Write-Host 'ISSUE97_EXACT_PID_BINDING_GATE=PASS'
          Write-Host "EXPECTED_LATER_SAFE_FAILURE=$caught"

      - name: Defender scan exact 1.16.2 candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = $env:ISSUE97_EXE
          $mp = @(
            "$env:ProgramFiles\Windows Defender\MpCmdRun.exe",
            "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe"
          ) | ForEach-Object { Get-Item $_ -ErrorAction SilentlyContinue } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mp) { throw 'MpCmdRun.exe not found on hosted runner' }
          & $mp.FullName -Scan -ScanType 3 -File $exe -DisableRemediation
          if ($LASTEXITCODE -notin @(0,2)) { throw "Defender scan failed with exit code $LASTEXITCODE" }
          $threats = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.Resources -match [regex]::Escape($exe) })
          if ($threats.Count -gt 0) { throw 'Defender detected launcher 1.16.2 Issue97 candidate' }
          Write-Host 'ISSUE97_1_16_2_DEFENDER=SCANNED_CLEAN'

      - name: Upload Issue97 RC
        uses: actions/upload-artifact@v4
        with:
          name: AotR-launcher-1.16.2-Issue97-RC
          path: |
            ${{ env.ISSUE97_OUT }}/package/AotR 8P WotR Mod.exe
            ${{ env.ISSUE97_OUT }}/package/manifest.json
            ${{ env.ISSUE97_OUT }}/package/repair-manifest.json
            ${{ env.ISSUE97_OUT }}/SHA256SUMS.json
            ${{ env.ISSUE97_OUT }}/DEFENDER_SCAN.txt
          if-no-files-found: error
