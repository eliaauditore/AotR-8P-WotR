name: Verify / promote launcher 1.16.3

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'launcher-source/v26/**'
      - 'launcher-source/BUILD_AOTR_8P_SINGLE_EXE_UPDATE_CHANNEL_V26_FINAL_1_16_3.ps1'
      - 'AotR 8P WotR Mod.exe'
      - 'manifest.json'
      - 'repair-manifest.json'
      - '.github/workflows/build-launcher-1-16-1-ux-rc.yml'
      - '.github/workflows/validate-issue78-runtime-fs.yml'
  push:
    branches:
      - release/launcher-1.16.3-public
    paths:
      - '.github/workflows/build-launcher-1-16-1-ux-rc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-public:
    name: Verify current public launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify public identity and embedded boundaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $public = (Resolve-Path '.\AotR 8P WotR Mod.exe').Path
          $manifest = Get-Content -LiteralPath '.\manifest.json' -Raw | ConvertFrom-Json
          $repair = Get-Content -LiteralPath '.\repair-manifest.json' -Raw | ConvertFrom-Json
          $version = [string]$manifest.launcher_version

          if ($version -notin @('1.16.2','1.16.3')) { throw "Unexpected public launcher version: $version" }
          if ([string]$repair.generated_for_launcher -ne $version) { throw "repair-manifest version mismatch" }

          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $public).Hash
          $expected = ([string]$manifest.launcher_sha256).ToUpperInvariant()
          if ($actual -ne $expected) { throw "Public EXE / manifest hash mismatch: expected $expected got $actual" }

          $fvi = [Diagnostics.FileVersionInfo]::GetVersionInfo($public)
          if ($fvi.ProductVersion -ne $version) { throw "ProductVersion mismatch: $($fvi.ProductVersion)" }

          if ($version -eq '1.16.2') {
            if ($actual -ne 'DA7F1F7F28A7D99A388CBC01AB783481961358FDB058DFD16FCCA587B6531508') {
              throw "Unexpected 1.16.2 binary identity: $actual"
            }
            $expectedGui = 'F17D8DE40DAAD271D9A85FC7C52F8B28DFAF18B35010AF587BF1D6076BA75F5F'
            $expectedEngine = '954D2FD4E23547998D2BC5323BB7026C21384CA4FCA59F7E786E6F0E18088880'
            $expectedFinal = 'F16522820D7B25CDD4ACF1267B8A300C6BFE661C7FEF636BB611819F7BDC84D3'
          }
          else {
            $expectedGui = 'D887A562E7C5700EC4F98AF49F9B807D95A5A91773E1C80091D8D97C3FE9FED3'
            $expectedEngine = '72967D49C4D35B4A3FAEBAC4F5866D8B910B9A7FC83568D04B9BA81364AC8917'
            $expectedFinal = 'F16522820D7B25CDD4ACF1267B8A300C6BFE661C7FEF636BB611819F7BDC84D3'
          }

          $asm = [Reflection.Assembly]::Load([IO.File]::ReadAllBytes($public))
          $tmp = Join-Path $env:RUNNER_TEMP "verify-public-$version"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null

          $resources = @(
            @{ Name='AotR8P.GuiScript'; File='gui.ps1'; Hash=$expectedGui },
            @{ Name='AotR8P.EngineScript'; File='engine.ps1'; Hash=$expectedEngine },
            @{ Name='AotR8P.FinalStableV7'; File='final_stable_v7.ps1'; Hash=$expectedFinal },
            @{ Name='AotR8P.V7Shellcode'; File='v7_shellcode.bin'; Hash='60EECE4660C3BA0AD183EB82B82DCDACF3ECA6DC892C8FAFCD629A92170ED45A' }
          )

          foreach ($item in $resources) {
            $stream = $asm.GetManifestResourceStream($item.Name)
            if (-not $stream) { throw "$($item.Name) missing from public EXE" }
            $target = Join-Path $tmp $item.File
            try {
              $out = [IO.File]::Create($target)
              try { $stream.CopyTo($out) } finally { $out.Dispose() }
            } finally { $stream.Dispose() }

            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash
            if ($hash -ne $item.Hash) { throw "$($item.Name) hash mismatch: $hash" }
          }

          foreach ($script in @('gui.ps1','engine.ps1','final_stable_v7.ps1')) {
            $path = Join-Path $tmp $script
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if (@($errors).Count -gt 0) { throw "PowerShell 5.1 parse failed: $script :: $($errors[0].Message)" }
          }

          if ($version -eq '1.16.3') {
            $engine = [IO.File]::ReadAllText((Join-Path $tmp 'engine.ps1'))
            $gui = [IO.File]::ReadAllText((Join-Path $tmp 'gui.ps1'))

            foreach ($required in @(
              '$gameTracker = [Diagnostics.Process]::GetProcessById($gamePid)',
              '$gameTracker.WaitForExit(1000)',
              'exit_code={2}',
              'runtime_location={3}',
              'runtime_sha256={4}',
              'wer={5}'
            )) {
              if ($engine.IndexOf($required,[StringComparison]::Ordinal) -lt 0) {
                throw "1.16.3 diagnostic contract missing: $required"
              }
            }

            if ($gui.IndexOf('Launcher 1.16.3',[StringComparison]::Ordinal) -lt 0) {
              throw '1.16.3 changelog missing'
            }
          }

          Write-Host "PUBLIC_IDENTITY_PASS :: version=$version :: sha256=$actual"

      - name: Issue103 diagnostic - trace reporting producer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'verify-public-1.16.3'
          $guiPath = Join-Path $tmp 'gui.ps1'
          $enginePath = Join-Path $tmp 'engine.ps1'
          if (-not (Test-Path -LiteralPath $guiPath)) { throw 'Extracted GUI missing' }
          if (-not (Test-Path -LiteralPath $enginePath)) { throw 'Extracted engine missing' }

          $gui = Get-Content -LiteralPath $guiPath
          $engine = Get-Content -LiteralPath $enginePath

          function Emit-Matches([string]$label, [string[]]$lines, [string]$pattern, [int]$radius = 5) {
            Write-Host "=== $label BEGIN ==="
            $seen = @{}
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match $pattern) {
                $lo = [Math]::Max(0, $i - $radius)
                $hi = [Math]::Min($lines.Count - 1, $i + $radius)
                for ($n = $lo; $n -le $hi; $n++) {
                  if (-not $seen.ContainsKey($n)) {
                    $seen[$n] = $true
                    Write-Host ('{0}: {1}' -f ($n+1), $lines[$n])
                  }
                }
                Write-Host '---'
              }
            }
            Write-Host "=== $label END ==="
          }

          Emit-Matches 'ISSUE103_GUI_REPORTING' $gui 'support_bundle|last_error|repair_attempts|fingerprint|direct-report|Invoke-RestMethod|exact_error|launcher_current|A8P-ENGINE-001|A8P-GAMEPROC-001|ConvertTo-Json' 8
          Emit-Matches 'ISSUE103_ENGINE_ERRORFLOW' $engine 'game\.dat exited during initialization|AOTR8P_ENGINE_EXIT|catch|throw|Write-Host|Write-Error' 5

      - name: Defender scan exact current public EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path '.\AotR 8P WotR Mod.exe').Path
          $mp = @(
            "$env:ProgramFiles\Windows Defender\MpCmdRun.exe",
            "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe"
          ) | ForEach-Object { Get-Item $_ -ErrorAction SilentlyContinue } | Sort-Object FullName -Descending | Select-Object -First 1

          if (-not $mp) { throw 'MpCmdRun.exe not found on hosted runner' }

          & $mp.FullName -Scan -ScanType 3 -File $exe -DisableRemediation
          if ($LASTEXITCODE -notin @(0,2)) { throw "Defender scan failed with exit code $LASTEXITCODE" }

          $threats = @(Get-MpThreatDetection -ErrorAction SilentlyContinue |
            Where-Object { $_.Resources -match [regex]::Escape($exe) })

          if ($threats.Count -gt 0) { throw 'Defender detected current public launcher' }
          Write-Host 'PUBLIC_DEFENDER=SCANNED_CLEAN'

  build-issue100-diagnostic:
    name: Build Issue100 launcher 1.16.3 diagnostic RC
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build 1.16.3 diagnostic candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'aotr-1.16.3-issue100-diagnostic'
          & '.\launcher-source\BUILD_AOTR_8P_SINGLE_EXE_UPDATE_CHANNEL_V26_FINAL_1_16_3.ps1' -OutputRoot $out
          if ($LASTEXITCODE -ne 0) { throw "V26 builder failed with exit code $LASTEXITCODE" }

          $exe = Join-Path $out 'package\AotR 8P WotR Mod.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw '1.16.3 candidate EXE missing' }

          $fvi = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($fvi.ProductVersion -ne '1.16.3') { throw "ProductVersion mismatch: $($fvi.ProductVersion)" }
          if ($fvi.FileVersion -ne '1.16.3.0') { throw "FileVersion mismatch: $($fvi.FileVersion)" }

          "ISSUE100_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ISSUE100_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ISSUE100_CANDIDATE_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash)"

      - name: Verify deterministic 1.16.3 resources
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = $env:ISSUE100_EXE
          $asm = [Reflection.Assembly]::Load([IO.File]::ReadAllBytes($exe))
          $tmp = Join-Path $env:RUNNER_TEMP 'issue100-resources'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null

          $resources = @(
            @{ Name='AotR8P.GuiScript'; File='gui.ps1'; Hash='D887A562E7C5700EC4F98AF49F9B807D95A5A91773E1C80091D8D97C3FE9FED3' },
            @{ Name='AotR8P.EngineScript'; File='engine.ps1'; Hash='72967D49C4D35B4A3FAEBAC4F5866D8B910B9A7FC83568D04B9BA81364AC8917' },
            @{ Name='AotR8P.FinalStableV7'; File='final_stable_v7.ps1'; Hash='F16522820D7B25CDD4ACF1267B8A300C6BFE661C7FEF636BB611819F7BDC84D3' },
            @{ Name='AotR8P.V7Shellcode'; File='v7_shellcode.bin'; Hash='60EECE4660C3BA0AD183EB82B82DCDACF3ECA6DC892C8FAFCD629A92170ED45A' }
          )

          foreach ($item in $resources) {
            $stream = $asm.GetManifestResourceStream($item.Name)
            if (-not $stream) { throw "$($item.Name) missing" }
            $target = Join-Path $tmp $item.File
            try {
              $out = [IO.File]::Create($target)
              try { $stream.CopyTo($out) } finally { $out.Dispose() }
            } finally { $stream.Dispose() }

            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash
            if ($hash -ne $item.Hash) { throw "$($item.Name) deterministic hash mismatch: $hash" }
          }

          foreach ($script in @('gui.ps1','engine.ps1','final_stable_v7.ps1')) {
            $path = Join-Path $tmp $script
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if (@($errors).Count -gt 0) { throw "PS5.1 parse failed: $script :: $($errors[0].Message)" }
          }

          $engine = [IO.File]::ReadAllText((Join-Path $tmp 'engine.ps1'))
          foreach ($required in @(
            '$gameTracker = [Diagnostics.Process]::GetProcessById($gamePid)',
            '$gameTracker.WaitForExit(1000)',
            'exit_code={2}',
            'runtime_location={3}',
            'runtime_sha256={4}',
            'wer={5}'
          )) {
            if ($engine.IndexOf($required,[StringComparison]::Ordinal) -lt 0) {
              throw "Issue100 diagnostic contract missing: $required"
            }
          }

          Write-Host 'ISSUE100_DIAGNOSTIC_BOUNDARY_GATE=PASS'

      - name: Defender scan exact 1.16.3 candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = $env:ISSUE100_EXE
          $mp = @(
            "$env:ProgramFiles\Windows Defender\MpCmdRun.exe",
            "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe"
          ) | ForEach-Object { Get-Item $_ -ErrorAction SilentlyContinue } | Sort-Object FullName -Descending | Select-Object -First 1

          if (-not $mp) { throw 'MpCmdRun.exe not found on hosted runner' }

          & $mp.FullName -Scan -ScanType 3 -File $exe -DisableRemediation
          if ($LASTEXITCODE -notin @(0,2)) { throw "Defender scan failed with exit code $LASTEXITCODE" }

          $threats = @(Get-MpThreatDetection -ErrorAction SilentlyContinue |
            Where-Object { $_.Resources -match [regex]::Escape($exe) })

          if ($threats.Count -gt 0) { throw 'Defender detected launcher 1.16.3 candidate' }
          Write-Host 'ISSUE100_1_16_3_DEFENDER=SCANNED_CLEAN'

      - name: Upload exact scanned 1.16.3 candidate
        uses: actions/upload-artifact@v4
        with:
          name: AotR-launcher-1.16.3-Issue100-Diagnostic-RC
          path: |
            ${{ env.ISSUE100_OUT }}/package/AotR 8P WotR Mod.exe
            ${{ env.ISSUE100_OUT }}/package/manifest.json
            ${{ env.ISSUE100_OUT }}/package/repair-manifest.json
            ${{ env.ISSUE100_OUT }}/SHA256SUMS.json
            ${{ env.ISSUE100_OUT }}/DEFENDER_SCAN.txt
          if-no-files-found: error

  promote-1-16-3:
    name: Promote 1.16.3 public
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/launcher-1.16.3-public'
    needs: [verify-public, build-issue100-diagnostic]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/launcher-1.16.3-public
          fetch-depth: 0

      - name: Download exact scanned candidate
        uses: actions/download-artifact@v4
        with:
          name: AotR-launcher-1.16.3-Issue100-Diagnostic-RC
          path: ${{ runner.temp }}/issue100-artifact

      - name: Re-scan and stage exact candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'issue100-artifact'
          $exe = Join-Path $root 'package\AotR 8P WotR Mod.exe'
          $candidateManifest = Join-Path $root 'package\manifest.json'
          $candidateRepair = Join-Path $root 'package\repair-manifest.json'

          foreach ($p in @($exe,$candidateManifest,$candidateRepair)) {
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "Promotion artifact missing: $p" }
          }

          $manifest = Get-Content -LiteralPath $candidateManifest -Raw | ConvertFrom-Json
          $repair = Get-Content -LiteralPath $candidateRepair -Raw | ConvertFrom-Json
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash

          if ([string]$manifest.launcher_version -ne '1.16.3') { throw 'Candidate manifest version mismatch' }
          if ([string]$repair.generated_for_launcher -ne '1.16.3') { throw 'Candidate repair-manifest version mismatch' }
          if ($actual -ne ([string]$manifest.launcher_sha256).ToUpperInvariant()) { throw 'Candidate EXE/manifest SHA mismatch' }

          $mp = @(
            "$env:ProgramFiles\Windows Defender\MpCmdRun.exe",
            "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe"
          ) | ForEach-Object { Get-Item $_ -ErrorAction SilentlyContinue } | Sort-Object FullName -Descending | Select-Object -First 1

          if (-not $mp) { throw 'MpCmdRun.exe not found on hosted runner' }

          & $mp.FullName -Scan -ScanType 3 -File $exe -DisableRemediation
          if ($LASTEXITCODE -notin @(0,2)) { throw "Defender promotion scan failed: $LASTEXITCODE" }

          $threats = @(Get-MpThreatDetection -ErrorAction SilentlyContinue |
            Where-Object { $_.Resources -match [regex]::Escape($exe) })

          if ($threats.Count -gt 0) { throw 'Defender detected exact promotion candidate' }

          Copy-Item -LiteralPath $exe -Destination '.\AotR 8P WotR Mod.exe' -Force
          Copy-Item -LiteralPath $candidateManifest -Destination '.\manifest.json' -Force
          Copy-Item -LiteralPath $candidateRepair -Destination '.\repair-manifest.json' -Force

          $publicHash = (Get-FileHash -Algorithm SHA256 -LiteralPath '.\AotR 8P WotR Mod.exe').Hash
          if ($publicHash -ne $actual) { throw 'Staged public EXE changed after Defender scan' }

          "PROMOTED_SHA256=$publicHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PUBLIC_1_16_3_PROMOTION_SCAN=SCANNED_CLEAN :: $publicHash"

      - name: Pre-commit release consistency
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json

          root = Path('.')
          manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8-sig'))
          repair = json.loads((root/'repair-manifest.json').read_text(encoding='utf-8-sig'))
          actual = hashlib.sha256((root/'AotR 8P WotR Mod.exe').read_bytes()).hexdigest().upper()

          assert manifest['launcher_version'] == '1.16.3'
          assert manifest['launcher_sha256'].upper() == actual
          assert repair['generated_for_launcher'] == '1.16.3'
          assert (root/'launcher-source'/'BUILD_AOTR_8P_SINGLE_EXE_UPDATE_CHANNEL_V26_FINAL_1_16_3.ps1').is_file()
          assert manifest['ui_sha256'].upper() == '827988C328E010A598BFAD16C9BFF830C3F904EAF1640F162C8124E8C6ABA376'
          assert manifest['paper_sha256'].upper() == '3FF683843190A323DE9299C17DCD36AF24C5C00473119478E3FAF068BF904E43'

          print('PUBLIC_1_16_3_PRECOMMIT_GATE=PASS :: ' + actual)

      - name: Commit guarded promotion to release branch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'AotR 8P WotR Mod.exe' 'manifest.json' 'repair-manifest.json'

          if (git diff --cached --quiet) { throw 'Promotion produced no public-file changes' }

          git commit -m "Release launcher 1.16.3 public - Issue100 diagnostics [$env:PROMOTED_SHA256]"
          git push origin HEAD:release/launcher-1.16.3-public
