name: Fix Issue 45 V7 Hash Consistency and Build RC6 V4 Once

on:
  push:
    branches:
      - feature/launcher-1.1.2-clean-architecture
    paths:
      - '.github/workflows/fix-issue45-v7-hash-consistency-build-rc6-v4-once.yml'

permissions:
  contents: write

jobs:
  rc6:
    runs-on: windows-2025
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/launcher-1.1.2-clean-architecture
          fetch-depth: 1

      - name: Checkout frozen 1.1.1 donor
        uses: actions/checkout@v5
        with:
          ref: v1.1.1
          path: donor-v1.1.1
          fetch-depth: 1

      - name: Patch only real issue45 source dependencies
        shell: python
        run: |
          from pathlib import Path
          FINAL='72D00490538BE2222F5BAAF3D8A1648A86071D3A098946A7B8751E7D337300E2'
          OLD_ENGINE='083DF914744BF9B78B3D0946337AA6C39C9FA2B980B8EF32094B3575E9A1557E'
          ZERO='0'*64

          p=Path('launcher-source/v19/prepare_clean_resources.py')
          t=p.read_text(encoding='utf-8-sig')
          stale='3D18D76722485E4716E8D8074831C6778484DE405BCDF949E9BD93C8AB5EFFED'
          if t.count(stale)!=1:
              raise SystemExit(f'stale FINAL_STABLE hash count={t.count(stale)}')
          t=t.replace(stale,FINAL,1)
          old=f'EXPECTED_ENGINE_OUT = "{OLD_ENGINE}"'
          if t.count(old)!=1:
              raise SystemExit('prepare_clean old Engine hash gate missing')
          t=t.replace(old,f'EXPECTED_ENGINE_OUT = "{ZERO}"',1)
          p.write_text(t,encoding='utf-8',newline='\n')

          p=Path('launcher-source/v19/BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1')
          t=p.read_text(encoding='utf-8-sig')
          old=f'Assert-Hash (Join-Path $Resources "launcher_engine.ps1") "{OLD_ENGINE}" "Clean engine"'
          if t.count(old)!=1:
              raise SystemExit('builder old Engine hash gate missing')
          t=t.replace(old,f'Assert-Hash (Join-Path $Resources "launcher_engine.ps1") "{ZERO}" "Clean engine"',1)

          lines=t.splitlines()
          indices=[i for i,line in enumerate(lines) if line.startswith('$finalPattern = ')]
          if len(indices)!=1:
              raise SystemExit(f'builder finalPattern line count={len(indices)}')
          lines[indices[0]]="$finalPattern = '(?s)\\$FinalStableV7Base64\\s*=\\s*@''\\s*(.*?)\\s*''@'"
          t='\n'.join(lines)+'\n'

          source_marker='Assert-Hash (Join-Path $Resources "v7_shellcode.bin") "60EECE4660C3BA0AD183EB82B82DCDACF3ECA6DC892C8FAFCD629A92170ED45A" "V7 shellcode resource"\n\nforeach ($path in @('
          source_repl='Assert-Hash (Join-Path $Resources "v7_shellcode.bin") "60EECE4660C3BA0AD183EB82B82DCDACF3ECA6DC892C8FAFCD629A92170ED45A" "V7 shellcode resource"\n\n& (Join-Path $PSScriptRoot "VERIFY_V7_RESOURCE_CHAIN.ps1") -ResourcesRoot $Resources\n\nforeach ($path in @('
          if t.count(source_marker)!=1:
              raise SystemExit(f'builder source verifier marker count={t.count(source_marker)}')
          t=t.replace(source_marker,source_repl,1)

          embedded_marker='Write-Host "STATIC CLEANUP PASS" -ForegroundColor Green\n\nCopy-Item -LiteralPath $DonorUi'
          embedded_repl='Write-Host "STATIC CLEANUP PASS" -ForegroundColor Green\n\n& (Join-Path $PSScriptRoot "VERIFY_V7_RESOURCE_CHAIN.ps1") -ResourcesRoot $Resources -ExePath $Exe\n\nCopy-Item -LiteralPath $DonorUi'
          if t.count(embedded_marker)!=1:
              raise SystemExit(f'builder embedded verifier marker count={t.count(embedded_marker)}')
          t=t.replace(embedded_marker,embedded_repl,1)
          p.write_text(t,encoding='utf-8',newline='\n')

      - name: Derive corrected deterministic Engine hash
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          try {
            .\launcher-source\v19\BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1 -FrozenDonorRoot .\donor-v1.1.1 -OutputRoot .\_RC6_DERIVE -LauncherVersion 1.1.2
            throw 'Unexpected success while Engine hash gate is zero.'
          }
          catch { Write-Host "Expected derivation stop: $($_.Exception.Message)" }
          $engine='.\_RC6_DERIVE\work\resources\launcher_engine.ps1'
          $final='.\_RC6_DERIVE\work\resources\final_stable_v7.ps1'
          if(-not(Test-Path -LiteralPath $engine)){throw 'Derived Engine resource missing'}
          if(-not(Test-Path -LiteralPath $final)){throw 'Derived FINAL_STABLE resource missing'}
          $h=(Get-FileHash -LiteralPath $engine -Algorithm SHA256).Hash.ToUpperInvariant()
          $fh=(Get-FileHash -LiteralPath $final -Algorithm SHA256).Hash.ToUpperInvariant()
          if($fh -ne '72D00490538BE2222F5BAAF3D8A1648A86071D3A098946A7B8751E7D337300E2'){throw "Unexpected FINAL hash: $fh"}
          $text=Get-Content -LiteralPath $engine -Raw -Encoding UTF8
          $m=[regex]::Match($text,'(?m)^\$FinalStableV7Sha256\s*=\s*"([A-Fa-f0-9]{64})"\s*$')
          if(-not $m.Success){throw 'Derived Engine expected FINAL hash constant missing'}
          if($m.Groups[1].Value.ToUpperInvariant() -ne $fh){throw "Derived Engine/V7 mismatch: $($m.Groups[1].Value) vs $fh"}
          if($text -notmatch 'AddParameter\("V7Shellcode", \[byte\[\]\]\$global:AOTR8P_V7_SHELLCODE_BYTES\)'){throw 'Derived Engine lost V7 child shellcode handoff'}
          "ENGINE_HASH=$h" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "RC6_DERIVED_ENGINE_SHA256=$h"
          Write-Host "RC6_DERIVED_ENGINE_V7_CROSS_GATE=PASS"
          $global:LASTEXITCODE=0
          exit 0

      - name: Pin corrected Engine hash
        shell: python
        run: |
          import os
          from pathlib import Path
          h=os.environ['ENGINE_HASH'].strip().upper()
          z='0'*64
          if len(h)!=64:
              raise SystemExit('invalid ENGINE_HASH')
          p=Path('launcher-source/v19/prepare_clean_resources.py')
          t=p.read_text(encoding='utf-8-sig')
          a=f'EXPECTED_ENGINE_OUT = "{z}"'
          if t.count(a)!=1:
              raise SystemExit('prepare_clean zero Engine gate missing')
          p.write_text(t.replace(a,f'EXPECTED_ENGINE_OUT = "{h}"',1),encoding='utf-8',newline='\n')
          p=Path('launcher-source/v19/BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1')
          t=p.read_text(encoding='utf-8-sig')
          a=f'Assert-Hash (Join-Path $Resources "launcher_engine.ps1") "{z}" "Clean engine"'
          if t.count(a)!=1:
              raise SystemExit('builder zero Engine gate missing')
          p.write_text(t.replace(a,f'Assert-Hash (Join-Path $Resources "launcher_engine.ps1") "{h}" "Clean engine"',1),encoding='utf-8',newline='\n')

      - name: Commit audited issue45 source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher-source/v19/prepare_clean_resources.py launcher-source/v19/BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1
          git commit -m "Launcher 1.1.2: fix and permanently verify V7 resource dependency"
          git push origin HEAD:feature/launcher-1.1.2-clean-architecture

      - name: Build RC6 through full permanent V7 verifier
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          .\launcher-source\v19\BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1 -FrozenDonorRoot .\donor-v1.1.1 -OutputRoot .\_RC6 -LauncherVersion 1.1.2
          Write-Host 'RC6_FULL_V7_CHAIN_BUILD_GATE=PASS' -ForegroundColor Green

      - name: Upload RC6 candidate
        uses: actions/upload-artifact@v4
        with:
          name: AotR-8P-WotR-1.1.2-RC6-Issue45-Audited
          path: |
            _RC6/AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip
            _RC6/AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip.sha256.txt
            _RC6/SHA256SUMS.json
            _RC6/DEFENDER_SCAN.txt
          if-no-files-found: error
          retention-days: 7
