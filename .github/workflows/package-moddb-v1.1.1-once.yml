name: Package ModDB Launcher 1.1.1 Once

on:
  push:
    branches:
      - guardian/moddb-package-v1.1.1
    paths:
      - ".github/workflows/package-moddb-v1.1.1-once.yml"

permissions:
  contents: read

jobs:
  package:
    name: moddb-package-1.1.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen release tag
        uses: actions/checkout@v5
        with:
          ref: v1.1.1
          fetch-depth: 1

      - name: Verify frozen public release files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c <<'EOF'
          2141EA9690708EA7A61B7298AD90E0C76CC417FED996AC0CF3685276BA2A4024  AotR 8P WotR Mod.exe
          B5B499DCC5ADA8A5ED5FADE3E60248F0685CD48D61042F7487D34660F83B6830  manifest.json
          DE45A92444E5943D9908267C5B80D1263F957E58EBC0840A6EDD00318A7741A8  repair-manifest.json
          827988C328E010A598BFAD16C9BFF830C3F904EAF1640F162C8124E8C6ABA376  payload_ui.big
          3FF683843190A323DE9299C17DCD36AF24C5C00473119478E3FAF068BF904E43  payload_paper.inc
          EOF

      - name: Build exact five-file ModDB ZIP
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import zipfile

          files = [
              "AotR 8P WotR Mod.exe",
              "manifest.json",
              "repair-manifest.json",
              "payload_ui.big",
              "payload_paper.inc",
          ]

          out = Path("AotR_8P_War_of_the_Ring_1.1.1_ModDB_Official.zip")
          fixed_time = (2026, 8, 27, 12, 43, 32)

          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for name in files:
                  data = Path(name).read_bytes()
                  info = zipfile.ZipInfo(name, fixed_time)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, data, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          with zipfile.ZipFile(out, "r") as zf:
              names = zf.namelist()
              if names != files:
                  raise SystemExit(f"Unexpected ZIP entries/order: {names!r}")
              for item in zf.infolist():
                  if "/" in item.filename or "\\" in item.filename:
                      raise SystemExit(f"ZIP entry is not flat-root: {item.filename}")

          digest = hashlib.sha256(out.read_bytes()).hexdigest().upper()
          Path(str(out) + ".sha256.txt").write_text(
              f"{digest}  {out.name}\n",
              encoding="ascii",
          )
          print(f"ZIP SHA256: {digest}")
          print(f"ZIP SIZE: {out.stat().st_size}")

      - name: Upload verified ModDB package
        uses: actions/upload-artifact@v4
        with:
          name: AotR-8P-WotR-1.1.1-ModDB-Official
          path: |
            AotR_8P_War_of_the_Ring_1.1.1_ModDB_Official.zip
            AotR_8P_War_of_the_Ring_1.1.1_ModDB_Official.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
