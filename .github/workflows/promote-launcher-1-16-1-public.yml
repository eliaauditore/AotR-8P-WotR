name: Promote launcher 1.16.1 public

on:
  push:
    branches:
      - release/launcher-1.16.1-public
    paths:
      - '.github/workflows/promote-launcher-1-16-1-public.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/launcher-1.16.1-public
          fetch-depth: 0

      - name: Build exact public candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'aotr-1.16.1-public'
          & '.\launcher-source\BUILD_AOTR_8P_SINGLE_EXE_UPDATE_CHANNEL_V24_FINAL_1_16_1.ps1' -OutputRoot $out
          if ($LASTEXITCODE -ne 0) { throw "FINAL builder failed with exit code $LASTEXITCODE" }
          $exe = Join-Path $out 'package\AotR 8P WotR Mod.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Candidate EXE missing' }
          $expected = 'BFBD459F798E88C4E5EDA803E071AACB24CF719AA0B6A321EBAD9CAB81B6223B'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          if ($actual -ne $expected) { throw "Candidate identity mismatch: expected $expected got $actual" }
          $fvi = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($fvi.ProductVersion -ne '1.16.1') { throw "ProductVersion mismatch: $($fvi.ProductVersion)" }
          if ($fvi.FileVersion -ne '1.16.1.0') { throw "FileVersion mismatch: $($fvi.FileVersion)" }
          "PUBLIC_CANDIDATE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PUBLIC_CANDIDATE_SHA256=$actual"

      - name: Hosted Defender gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = $env:PUBLIC_CANDIDATE
          $mp = @(
            "$env:ProgramFiles\Windows Defender\MpCmdRun.exe",
            "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe"
          ) | ForEach-Object { Get-Item $_ -ErrorAction SilentlyContinue } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mp) { throw 'MpCmdRun.exe not found on hosted runner' }
          & $mp.FullName -Scan -ScanType 3 -File $exe -DisableRemediation
          if ($LASTEXITCODE -notin @(0,2)) { throw "Defender scan failed with exit code $LASTEXITCODE" }
          $threats = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.Resources -match [regex]::Escape($exe) })
          if ($threats.Count -gt 0) {
            $threats | Format-List *
            throw 'Defender detected the exact 1.16.1 public candidate'
          }
          Write-Host 'PUBLIC_DEFENDER_GATE=SCANNED_CLEAN'

      - name: Stage public EXE and manifests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'BFBD459F798E88C4E5EDA803E071AACB24CF719AA0B6A321EBAD9CAB81B6223B'
          Copy-Item -LiteralPath $env:PUBLIC_CANDIDATE -Destination '.\AotR 8P WotR Mod.exe' -Force
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath '.\AotR 8P WotR Mod.exe').Hash
          if ($actual -ne $expected) { throw "Staged public EXE mismatch: $actual" }

          $manifest = Get-Content -LiteralPath '.\manifest.json' -Raw | ConvertFrom-Json
          $manifest.launcher_version = '1.16.1'
          $manifest.launcher_sha256 = $expected
          $manifest | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath '.\manifest.json' -Encoding UTF8

          $repair = Get-Content -LiteralPath '.\repair-manifest.json' -Raw | ConvertFrom-Json
          $repair.generated_for_launcher = '1.16.1'
          $repair | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath '.\repair-manifest.json' -Encoding UTF8

      - name: Pre-commit public consistency gate
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          root = Path('.')
          manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8-sig'))
          repair = json.loads((root/'repair-manifest.json').read_text(encoding='utf-8-sig'))
          expected = 'BFBD459F798E88C4E5EDA803E071AACB24CF719AA0B6A321EBAD9CAB81B6223B'
          actual = hashlib.sha256((root/'AotR 8P WotR Mod.exe').read_bytes()).hexdigest().upper()
          assert manifest['launcher_version'] == '1.16.1'
          assert manifest['launcher_sha256'] == expected
          assert repair['generated_for_launcher'] == '1.16.1'
          assert actual == expected
          assert (root/'launcher-source'/'BUILD_AOTR_8P_SINGLE_EXE_UPDATE_CHANNEL_V24_FINAL_1_16_1.ps1').is_file()
          print('PUBLIC_1_16_1_PRECOMMIT_GATE=PASS')

      - name: Commit guarded promotion to release branch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'AotR 8P WotR Mod.exe' 'manifest.json' 'repair-manifest.json'
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Release launcher 1.16.1 public (Defender-clean unsigned)'
            git push origin HEAD:release/launcher-1.16.1-public
          } else {
            Write-Host 'Public files already match 1.16.1; nothing to commit.'
          }
