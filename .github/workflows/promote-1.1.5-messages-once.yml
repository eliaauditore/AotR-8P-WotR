name: Promote 1.1.5 Messages Once
# retry: byte-preserving GUI transform

on:
  push:
    branches:
      - hotfix/messages-master-lookup
    paths:
      - '.github/workflows/promote-1.1.5-messages-once.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build, validate public master lookup, and promote exact bytes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out="$env:RUNNER_TEMP\messages-1.1.5"
          & '.\launcher-source\v22\BUILD_LAUNCHER_1_1_5_MESSAGES_CANDIDATE.ps1' -OutputRoot $out -LauncherVersion '1.1.5'
          $package=Join-Path $out 'package'
          $exe=Join-Path $package 'AotR 8P WotR Mod.exe'
          if(-not (Test-Path -LiteralPath $exe -PathType Leaf)){throw 'candidate EXE missing'}
          if((Get-Content (Join-Path $out 'DEFENDER_SCAN.txt') -Raw).Trim() -ne 'SCANNED_CLEAN'){throw 'Defender gate not clean'}

          $manifest=Get-Content (Join-Path $package 'manifest.json') -Raw | ConvertFrom-Json
          $exeHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          if($manifest.launcher_version -ne '1.1.5'){throw 'manifest version mismatch'}
          if($manifest.launcher_sha256 -ne $exeHash){throw 'manifest hash mismatch'}
          $repair=Get-Content (Join-Path $package 'repair-manifest.json') -Raw | ConvertFrom-Json
          if($repair.generated_for_launcher -ne '1.1.5'){throw 'repair manifest version mismatch'}

          $asm=[Reflection.Assembly]::Load([IO.File]::ReadAllBytes($exe))
          $s=$asm.GetManifestResourceStream('AotR8P.GuiScript')
          if(-not $s){throw 'GUI resource missing'}
          $gui=Join-Path $env:RUNNER_TEMP 'messages-gui.ps1'
          try{$o=[IO.File]::Create($gui);try{$s.CopyTo($o)}finally{$o.Dispose()}}finally{$s.Dispose()}
          $guiText=Get-Content -LiteralPath $gui -Raw
          $fixed='repo:eliaauditore/AotR-8P-WotR is:issue label:master-ticket'
          $broken='repo:eliaauditore/AotR-8P-WotR label:master-ticket'
          if($guiText.IndexOf($fixed,[StringComparison]::Ordinal) -lt 0){throw 'fixed is:issue master query missing'}
          if($guiText.IndexOf($broken,[StringComparison]::Ordinal) -ge 0){throw 'broken legacy master query still present'}

          $fp='A8P-FP-53730198C7CD'
          $query=[Uri]::EscapeDataString('repo:eliaauditore/AotR-8P-WotR is:issue label:master-ticket "'+$fp+'"')
          $headers=@{'User-Agent'='AotR-8P-WotR-Launcher-CI';'Accept'='application/vnd.github+json'}
          $result=Invoke-RestMethod -UseBasicParsing -Headers $headers -Uri ("https://api.github.com/search/issues?q=$query&per_page=10")
          $matches=@($result.items | Where-Object { [int]$_.number -eq 78 -and ([string]$_.body).Contains($fp) })
          if($matches.Count -lt 1){throw 'public master lookup did not resolve issue #78'}
          $comments=Invoke-RestMethod -UseBasicParsing -Headers $headers -Uri 'https://api.github.com/repos/eliaauditore/AotR-8P-WotR/issues/78/comments?per_page=100'
          $broadcast=@($comments | Where-Object { @('OWNER','MEMBER','COLLABORATOR') -contains [string]$_.author_association -and -not ([string]$_.body).Contains('<!-- no-broadcast -->') -and -not ([string]$_.body).TrimStart().StartsWith('[internal]',[StringComparison]::OrdinalIgnoreCase) })
          if(-not ($broadcast | Where-Object { [Int64]$_.id -eq 5449463070 })){throw 'expected maintainer retest message not visible through public API'}
          Write-Host 'MESSAGES_PUBLIC_MASTER_E2E=PASS'

          foreach($name in @('AotR 8P WotR Mod.exe','manifest.json','repair-manifest.json','payload_ui.big','payload_paper.inc')){
            Copy-Item -LiteralPath (Join-Path $package $name) -Destination (Join-Path (Get-Location) $name) -Force
          }
          $size=(Get-Item -LiteralPath $exe).Length
          $checkpoint=@(
            '# Release checkpoint — 1.1.5','',
            '- Distribution: GitHub update channel only; no new ModDB package.',
            '- Fix: MESSAGES master-ticket lookup now includes `is:issue` required by GitHub Search API.',
            '- Verified public lookup: fingerprint `A8P-FP-53730198C7CD` resolves master issue #78.',
            '- Verified public maintainer message: comment `5449463070` is broadcast-visible.',
            '- Launcher SHA256: `'+$exeHash+'`',
            '- Launcher size: `'+$size+'` bytes',
            '- Defender: `SCANNED_CLEAN`','',
            'The promoted public EXE is the exact binary that passed the public GitHub master/message lookup gate in this job.'
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText('docs/RELEASE_CHECKPOINT_1.1.5.md',$checkpoint+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f '.github/workflows/promote-1.1.5-messages-once.yml'
          git add -- 'AotR 8P WotR Mod.exe' 'manifest.json' 'repair-manifest.json' 'payload_ui.big' 'payload_paper.inc' 'docs/RELEASE_CHECKPOINT_1.1.5.md'
          git commit -m 'Promote launcher 1.1.5 messages lookup hotfix'
          git push origin HEAD:hotfix/messages-master-lookup
          Write-Host "PROMOTED_EXE_SHA256=$exeHash"
