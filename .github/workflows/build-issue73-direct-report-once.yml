name: Build Issue73 Direct Report Once

on:
  push:
    branches:
      - feature/accountless-direct-report
    paths:
      - ".github/workflows/build-issue73-direct-report-once.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/accountless-direct-report
          fetch-depth: 1

      - name: Checkout frozen 1.1.1 donor
        uses: actions/checkout@v5
        with:
          ref: v1.1.1
          path: donor-v1.1.1
          fetch-depth: 1

      - name: Derive deterministic Issue73 GUI hash
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          .\launcher-source\v19\BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1 `
            -FrozenDonorRoot .\donor-v1.1.1 `
            -OutputRoot .\_ISSUE73_DERIVE `
            -LauncherVersion 1.1.2

          $gui='.\_ISSUE73_DERIVE\work\resources\launcher_gui.ps1'
          python .\launcher-source\v19\apply_issue73_direct_report.py $gui
          if($LASTEXITCODE -ne 0){throw 'Issue73 transform failed during hash derivation'}

          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($gui,[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){throw "Issue73 PS5 parse failed: $($errors[0].Message)"}

          $h=(Get-FileHash -LiteralPath $gui -Algorithm SHA256).Hash.ToUpperInvariant()
          "ISSUE73_GUI_HASH=$h" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ISSUE73_DERIVED_GUI_SHA256=$h"

      - name: Pin Issue73 transform into deterministic builder
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $h=[string]$env:ISSUE73_GUI_HASH
          if($h -notmatch '^[A-F0-9]{64}$'){throw "Invalid derived GUI hash: $h"}

          $p='.\launcher-source\v19\BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1'
          $t=Get-Content -LiteralPath $p -Raw -Encoding UTF8

          $anchor=@'
          & $Python (Join-Path $PSScriptRoot "apply_issue43_recheck_flow.py") (Join-Path $Resources "launcher_gui.ps1") --expected-output "135B1FDD64B84B0DE84BC7526F04157A790228DFC49FF5DD6253C89023D71EBD"
          if ($LASTEXITCODE -ne 0) { throw "Issue43 post-repair health re-check transform failed" }
          & $Python (Join-Path $PSScriptRoot "prepare_final_stable_resource.py") $FrozenFinal (Join-Path $Resources "final_stable_v7.ps1") (Join-Path $Resources "v7_shellcode.bin")
          '@.Trim()

          $replacement=@"
          & `$Python (Join-Path `$PSScriptRoot "apply_issue43_recheck_flow.py") (Join-Path `$Resources "launcher_gui.ps1") --expected-output "135B1FDD64B84B0DE84BC7526F04157A790228DFC49FF5DD6253C89023D71EBD"
          if (`$LASTEXITCODE -ne 0) { throw "Issue43 post-repair health re-check transform failed" }
          & `$Python (Join-Path `$PSScriptRoot "apply_issue73_direct_report.py") (Join-Path `$Resources "launcher_gui.ps1") --expected-output "$h"
          if (`$LASTEXITCODE -ne 0) { throw "Issue73 accountless direct-report transform failed" }
          & `$Python (Join-Path `$PSScriptRoot "prepare_final_stable_resource.py") `$FrozenFinal (Join-Path `$Resources "final_stable_v7.ps1") (Join-Path `$Resources "v7_shellcode.bin")
          "@.Trim()

          if(([regex]::Matches($t,[regex]::Escape($anchor))).Count -ne 1){throw 'Builder Issue43 transform anchor is not unique'}
          $t=$t.Replace($anchor,$replacement)

          $old='Assert-Hash (Join-Path $Resources "launcher_gui.ps1") "135B1FDD64B84B0DE84BC7526F04157A790228DFC49FF5DD6253C89023D71EBD" "Clean GUI Issue43"'
          $new='Assert-Hash (Join-Path $Resources "launcher_gui.ps1") "'+$h+'" "Clean GUI Issue73"'
          if(([regex]::Matches($t,[regex]::Escape($old))).Count -ne 1){throw 'Builder GUI hash anchor is not unique'}
          $t=$t.Replace($old,$new)

          [IO.File]::WriteAllText((Resolve-Path $p),$t,(New-Object Text.UTF8Encoding($false)))

      - name: Commit deterministic Issue73 builder integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher-source/v19/BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1
          git commit -m "Launcher 1.1.2: integrate accountless direct reporting"
          git push origin HEAD:feature/accountless-direct-report

      - name: Build complete Issue73 candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          .\launcher-source\v19\BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1 `
            -FrozenDonorRoot .\donor-v1.1.1 `
            -OutputRoot .\_ISSUE73_CANDIDATE `
            -LauncherVersion 1.1.2

      - name: Verify Issue73 GUI and immutable engine chain
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $r='.\_ISSUE73_CANDIDATE\work\resources'
          $gui=Join-Path $r 'launcher_gui.ps1'
          $engine=Join-Path $r 'launcher_engine.ps1'
          $final=Join-Path $r 'final_stable_v7.ps1'
          $shellcode=Join-Path $r 'v7_shellcode.bin'

          $guiHash=(Get-FileHash $gui -Algorithm SHA256).Hash.ToUpperInvariant()
          if($guiHash -ne $env:ISSUE73_GUI_HASH){throw "Issue73 GUI hash mismatch: $guiHash"}
          if((Get-FileHash $engine -Algorithm SHA256).Hash.ToUpperInvariant() -ne '5DB2F749F10E84322BC471FFF04E25326EFF194FA440175FE9841ED13367F938'){throw 'Engine drifted'}
          if((Get-FileHash $final -Algorithm SHA256).Hash.ToUpperInvariant() -ne '72D00490538BE2222F5BAAF3D8A1648A86071D3A098946A7B8751E7D337300E2'){throw 'FINAL_STABLE_V7 drifted'}
          if((Get-FileHash $shellcode -Algorithm SHA256).Hash.ToUpperInvariant() -ne '60EECE4660C3BA0AD183EB82B82DCDACF3ECA6DC892C8FAFCD629A92170ED45A'){throw 'V7 shellcode drifted'}

          $txt=Get-Content -LiteralPath $gui -Raw -Encoding UTF8
          foreach($required in @(
            'SEND REPORT','OPEN GITHUB','COPY REPORT',
            'function Send-LauncherReport {',
            'function Open-ExternalUrlSafe([string]$Url)',
            '$script:HttpClient.PostAsync($endpoint,$content)',
            'direct-report.json',
            'A8P-TICKET-{0:D4}',
            'Browser could not open — report link copied.'
          )){
            if($txt.IndexOf($required,[StringComparison]::Ordinal) -lt 0){throw "Missing Issue73 token: $required"}
          }
          foreach($forbidden in @('GITHUB_REPORT_TOKEN','Authorization: Bearer','github_pat_','ghp_')){
            if($txt.IndexOf($forbidden,[StringComparison]::Ordinal) -ge 0){throw "Forbidden launcher credential token: $forbidden"}
          }
          if($txt.IndexOf('$DiagRetryHit.Add_MouseLeftButtonUp({',[StringComparison]::Ordinal) -lt 0){throw 'RETRY handler lost'}
          Write-Host "ISSUE73_GUI_GATE=PASS :: $guiHash" -ForegroundColor Green
          Write-Host 'ISSUE73_ENGINE_V7_IMMUTABILITY_GATE=PASS' -ForegroundColor Green
          Write-Host 'ISSUE72_BROWSER_FALLBACK_GATE=PASS' -ForegroundColor Green
          Write-Host 'ISSUE73_NO_CLIENT_SECRET_GATE=PASS' -ForegroundColor Green

      - name: Validate backend syntax and disabled production config
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check .\direct-report-backend\api\report.js
          if($LASTEXITCODE -ne 0){throw 'Backend JavaScript syntax invalid'}
          $cfg=Get-Content .\direct-report.json -Raw | ConvertFrom-Json
          if([bool]$cfg.enabled){throw 'Direct-report production config must stay disabled until backend secret/deployment is live'}
          if(-not [string]::IsNullOrWhiteSpace([string]$cfg.endpoint)){throw 'Disabled direct-report config unexpectedly contains an endpoint'}
          Write-Host 'ISSUE73_BACKEND_STATIC_GATE=PASS' -ForegroundColor Green

      - name: Upload Issue73 candidate
        uses: actions/upload-artifact@v4
        with:
          name: AotR-8P-WotR-1.1.2-Issue73-Accountless-Report
          path: |
            _ISSUE73_CANDIDATE/AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip
            _ISSUE73_CANDIDATE/AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip.sha256.txt
            _ISSUE73_CANDIDATE/SHA256SUMS.json
            _ISSUE73_CANDIDATE/DEFENDER_SCAN.txt
          if-no-files-found: error
          retention-days: 7
