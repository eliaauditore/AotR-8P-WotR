name: Validate Issue78 Runtime FS

on:
  push:
    branches:
      - hotfix/external-drive-link-fallback
    paths:
      - 'launcher-source/v21/**'
      - '.github/workflows/validate-issue78-runtime-fs.yml'
  pull_request:
    paths:
      - 'launcher-source/v21/**'
      - 'repair-manifest.json'
      - 'manifest.json'
      - 'AotR 8P WotR Mod.exe'
      - '.github/workflows/validate-issue78-runtime-fs.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate runtime filesystem fix in current candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path '.\AotR 8P WotR Mod.exe').Path
          $manifest=Get-Content '.\manifest.json' -Raw | ConvertFrom-Json
          $actualExe=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          if($manifest.launcher_sha256 -ne $actualExe){throw 'manifest/exe hash mismatch'}

          $asm=[Reflection.Assembly]::Load([IO.File]::ReadAllBytes($exe))
          function Export-Resource([string]$Name,[string]$Path){
            $s=$asm.GetManifestResourceStream($Name)
            if(-not $s){throw "missing resource $Name"}
            try{$o=[IO.File]::Create($Path);try{$s.CopyTo($o)}finally{$o.Dispose()}}finally{$s.Dispose()}
          }
          $engine=Join-Path $env:RUNNER_TEMP 'issue78-current-engine.ps1'
          $gui=Join-Path $env:RUNNER_TEMP 'issue78-current-gui.ps1'
          Export-Resource 'AotR8P.EngineScript' $engine
          Export-Resource 'AotR8P.GuiScript' $gui

          $engineHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $engine).Hash
          $expectedEngine='E9E2452FF56A66D57FF63C0B1654CFE0C856F4D5FA66C558E8F237C9ABABF641'
          if($engineHash -ne $expectedEngine){throw "Issue78 engine regression: $engineHash"}

          foreach($path in @($engine,$gui)){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "PowerShell parse failure in $path :: $($errors[0].Message)"}
          }

          $engineText=Get-Content $engine -Raw
          $guiText=Get-Content $gui -Raw
          foreach($needle in @('Get-AotR8PVolumeRoot','Get-AotR8PRuntimeStageRoot','ItemType SymbolicLink','Copy-Item')){
            if($engineText.IndexOf($needle,[StringComparison]::Ordinal) -lt 0){throw "runtime filesystem contract missing: $needle"}
          }
          if($engineText.IndexOf('Join-Path $stateRoot "runtime"',[StringComparison]::Ordinal) -lt 0){throw 'local runtime stage root missing'}
          if($guiText.IndexOf('A8P-RUNTIME-FS-001',[StringComparison]::Ordinal) -lt 0){throw 'runtime filesystem error classification missing'}
          if($guiText.IndexOf('Join-Path $env:LOCALAPPDATA "AotR 8P WotR Mod"',[StringComparison]::Ordinal) -lt 0){throw 'local runtime reset path missing'}

          $repair=Get-Content '.\repair-manifest.json' -Raw | ConvertFrom-Json
          $plan=$repair.plans.'A8P-RUNTIME-FS-001'
          if(-not $plan){throw 'A8P-RUNTIME-FS-001 repair plan missing'}
          $expected=@('stop_legacy_runtime','stop_failed_game','reset_runtime','clear_compat_cache','retry_launch')
          if((@($plan.actions)-join '|') -ne ($expected-join '|')){throw 'A8P-RUNTIME-FS-001 repair plan mismatch'}

          # Exercise the current embedded link/copy functions across distinct CI volumes.
          $tokens=$null;$errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($engine,[ref]$tokens,[ref]$errors)
          $wanted=@{}
          foreach($n in @('Get-AotR8PVolumeRoot','New-LinkedFile','New-LinkedDirectory')){$wanted[$n]=$true}
          $funcs=@($ast.FindAll({param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $wanted.ContainsKey($node.Name)},$true))
          if($funcs.Count -ne 3){throw 'runtime function extraction mismatch'}
          $fnFile=Join-Path $env:RUNNER_TEMP 'issue78-current-functions.ps1'
          [IO.File]::WriteAllText($fnFile,(($funcs|ForEach-Object{$_.Extent.Text})-join "`r`n`r`n"),(New-Object Text.UTF8Encoding($false)))
          . $fnFile

          $sourceRoot=(Resolve-Path '.').Path
          $sourceDrive=[IO.Path]::GetPathRoot($sourceRoot)
          $destRoot="C:\A8P_Issue78_Current_$PID"
          if([IO.Path]::GetPathRoot($destRoot) -ieq $sourceDrive){throw 'CI did not provide distinct source/destination volumes'}
          New-Item -ItemType Directory -Force -Path $destRoot | Out-Null
          try{
            $srcFile=Join-Path $sourceRoot 'issue78-current-file.txt'
            [IO.File]::WriteAllText($srcFile,'cross-volume',[Text.Encoding]::UTF8)
            $dstFile=Join-Path $destRoot 'file.txt'
            New-LinkedFile $srcFile $dstFile
            if([IO.File]::ReadAllText($dstFile) -ne 'cross-volume'){throw 'cross-volume file staging failed'}

            $srcDir=Join-Path $sourceRoot 'issue78-current-dir'
            New-Item -ItemType Directory -Force -Path $srcDir | Out-Null
            [IO.File]::WriteAllText((Join-Path $srcDir 'probe.txt'),'directory',[Text.Encoding]::UTF8)
            $dstDir=Join-Path $destRoot 'dir'
            New-LinkedDirectory $srcDir $dstDir
            if([IO.File]::ReadAllText((Join-Path $dstDir 'probe.txt')) -ne 'directory'){throw 'cross-volume directory staging failed'}
          }
          finally{
            Remove-Item -LiteralPath $destRoot -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath (Join-Path $sourceRoot 'issue78-current-file.txt') -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath (Join-Path $sourceRoot 'issue78-current-dir') -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'ISSUE78_CURRENT_RELEASE_GATE=PASS'
