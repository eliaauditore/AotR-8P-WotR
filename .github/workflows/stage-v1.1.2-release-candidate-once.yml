name: Stage Launcher 1.1.2 Exact Release Candidate Once

on:
  push:
    branches:
      - release/1.1.2
    paths:
      - '.github/workflows/stage-v1.1.2-release-candidate-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  stage-release:
    runs-on: windows-2025
    steps:
      - name: Checkout clean release branch
        uses: actions/checkout@v5
        with:
          ref: release/1.1.2
          fetch-depth: 0

      - name: Preserve exact LF source bytes for donor checkout
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout exact runtime-accepted source state
        uses: actions/checkout@v5
        with:
          ref: 59a18ed496b254f6854f2261c85422fdbafe1063
          path: accepted-source
          fetch-depth: 1

      - name: Checkout frozen v1.1.1 donor
        uses: actions/checkout@v5
        with:
          ref: v1.1.1
          path: donor-v1.1.1
          fetch-depth: 1

      - name: Copy only final 1.1.2 source files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dst='launcher-source\v19'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $files=@(
            'BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1',
            'VERIFY_V7_RESOURCE_CHAIN.ps1',
            'apply_issue43_recheck_flow.py',
            'launcher.cs',
            'prepare_clean_resources.py',
            'prepare_final_stable_resource.py'
          )
          foreach($name in $files){
            Copy-Item -LiteralPath (Join-Path 'accepted-source\launcher-source\v19' $name) -Destination (Join-Path $dst $name) -Force
          }
          Write-Host 'FINAL_SOURCE_COPY_GATE=PASS'

      - name: Rebuild source once through all permanent gates
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          .\launcher-source\v19\BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1 `
            -FrozenDonorRoot .\donor-v1.1.1 `
            -OutputRoot .\_SOURCE_VERIFY `
            -LauncherVersion 1.1.2
          Write-Host 'FINAL_SOURCE_REBUILD_GATE=PASS' -ForegroundColor Green

      - name: Download exact runtime-tested RC7 artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path '.\rc7-artifact' | Out-Null
          gh run download 33098884873 --repo $env:GITHUB_REPOSITORY --name 'AotR-8P-WotR-1.1.2-RC7-Issue43-Recheck-AutoLaunch' --dir '.\rc7-artifact'
          $inner='.\rc7-artifact\AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip'
          if(-not(Test-Path -LiteralPath $inner -PathType Leaf)){throw 'Exact RC7 inner ZIP missing'}
          $zipHash=(Get-FileHash -LiteralPath $inner -Algorithm SHA256).Hash.ToUpperInvariant()
          if($zipHash -ne 'F67DFE9E2E4215982891D58302445AF95CF177A341E95D54E8D4C0F01EE1D097'){throw "RC7 ZIP hash mismatch: $zipHash"}
          Write-Host "EXACT_RC7_ZIP_SHA256=$zipHash"

      - name: Verify and stage exact five-file public release set
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $inner='.\rc7-artifact\AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip'
          $exact='.\rc7-exact'
          if(Test-Path $exact){Remove-Item -Recurse -Force $exact}
          Expand-Archive -LiteralPath $inner -DestinationPath $exact -Force

          $expectedNames=@('AotR 8P WotR Mod.exe','manifest.json','payload_paper.inc','payload_ui.big','repair-manifest.json') | Sort-Object
          $actualNames=@(Get-ChildItem -LiteralPath $exact -File | Select-Object -ExpandProperty Name | Sort-Object)
          $diff=Compare-Object $expectedNames $actualNames
          if($diff){throw ('Public file-set mismatch: '+(($diff|Out-String).Trim()))}

          $hashes=@{
            'AotR 8P WotR Mod.exe'='5B4D12B7BF43D72860E27C51A3D8AC7AC00CA53DB58499E41AC735F7B7ECED0E'
            'manifest.json'='26851416B61745E0009550A924F54E8AF47992693A01728E348DBC530FEAC729'
            'repair-manifest.json'='B2BEEBF586F95D2E2F6B4A86F142FEF40561E72C907A4BDB3FA5D597377855AA'
            'payload_ui.big'='827988C328E010A598BFAD16C9BFF830C3F904EAF1640F162C8124E8C6ABA376'
            'payload_paper.inc'='3FF683843190A323DE9299C17DCD36AF24C5C00473119478E3FAF068BF904E43'
          }
          foreach($name in $hashes.Keys){
            $path=Join-Path $exact $name
            $h=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToUpperInvariant()
            if($h -ne $hashes[$name]){throw "$name hash mismatch: $h"}
          }

          $manifest=Get-Content -LiteralPath (Join-Path $exact 'manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if([string]$manifest.launcher_version -ne '1.1.2'){throw 'Manifest launcher_version mismatch'}
          if(([string]$manifest.launcher_sha256).ToUpperInvariant() -ne '5B4D12B7BF43D72860E27C51A3D8AC7AC00CA53DB58499E41AC735F7B7ECED0E'){throw 'Manifest launcher_sha256 mismatch'}
          $repair=Get-Content -LiteralPath (Join-Path $exact 'repair-manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if([string]$repair.generated_for_launcher -ne '1.1.2'){throw 'Repair manifest version mismatch'}

          foreach($name in $expectedNames){Copy-Item -LiteralPath (Join-Path $exact $name) -Destination (Join-Path $PWD $name) -Force}
          Write-Host 'EXACT_FIVE_FILE_RELEASE_GATE=PASS' -ForegroundColor Green

      - name: Write guarded 1.1.2 release checkpoint
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path 'docs\release' | Out-Null
          $builder=(Get-FileHash -LiteralPath 'launcher-source\v19\BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1' -Algorithm SHA256).Hash.ToUpperInvariant()
          $text=@"
          # Launcher 1.1.2 Release Checkpoint

          ## Status

          `1.1.2` is staged from the exact RC7 artifact that passed real runtime acceptance. This checkpoint does **not** declare ModDB AV acceptance complete: Issue #38 remains the final distribution blocker until the exact release bytes pass a current Defender/cloud test in a clean Windows environment with no prior allow/exclusion for this launcher.

          ## Exact release candidate

          - Version: `1.1.2`
          - Release branch: `release/1.1.2`
          - Accepted development source: `59a18ed496b254f6854f2261c85422fdbafe1063`
          - RC7 workflow run: `33098884873`
          - RC7 artifact ID: `9657563731`
          - RC7 public ZIP SHA256: `F67DFE9E2E4215982891D58302445AF95CF177A341E95D54E8D4C0F01EE1D097`
          - Exact runtime-tested EXE SHA256: `5B4D12B7BF43D72860E27C51A3D8AC7AC00CA53DB58499E41AC735F7B7ECED0E`
          - Manifest SHA256: `26851416B61745E0009550A924F54E8AF47992693A01728E348DBC530FEAC729`
          - Repair manifest SHA256: `B2BEEBF586F95D2E2F6B4A86F142FEF40561E72C907A4BDB3FA5D597377855AA`
          - UI SHA256: `827988C328E010A598BFAD16C9BFF830C3F904EAF1640F162C8124E8C6ABA376`
          - Paper SHA256: `3FF683843190A323DE9299C17DCD36AF24C5C00473119478E3FAF068BF904E43`
          - Canonical 1.1.2 builder SHA256: `$builder`

          ## Runtime acceptance

          User-confirmed on RC7:

          - fresh standalone extraction/start: PASS
          - Auto-Repair: PASS
          - post-repair full health re-check: PASS
          - automatic launch only after clean re-check: PASS
          - launcher handoff/automatic close: PASS
          - game launch: PASS
          - 8-player WotR rows: PASS
          - strategic-map zoom: PASS
          - strategic-map drag: PASS
          - no `A8P-ENGINE-001`: PASS

          ## Permanent integrity gates

          - Windows PowerShell 5.1 parse: PASS
          - V7 source chain: PASS
          - V7 child parameter binding: PASS
          - embedded Engine/V7/Shellcode byte/hash verification: PASS
          - embedded cross-resource hash consistency: PASS
          - static cleanup gate: PASS
          - hosted Defender exact candidate scan: CLEAN

          ## Release safety

          - `main` and `v1.1.1` remain untouched until guarded PR merge.
          - Historical RC failures remain preserved in the development branch/history.
          - The .NET Framework `csc.exe` path is byte-nondeterministic; a later rebuild is **not** allowed to silently replace the exact runtime-tested EXE above.
          - Do not ask users to disable Defender, whitelist the launcher, or restore a quarantined release as the distribution solution.
          - ModDB publication remains blocked on Issue #38 clean-environment Defender acceptance of the exact staged bytes.
          "@
          [IO.File]::WriteAllText((Join-Path $PWD 'docs\release\LAUNCHER_1_1_2_RELEASE_CHECKPOINT.md'),$text.Trim()+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))
          Write-Host "CANONICAL_1_1_2_BUILDER_SHA256=$builder"

      - name: Commit exact staged release and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage-v1.1.2-release-candidate-once.yml
          rm -rf accepted-source donor-v1.1.1 rc7-artifact rc7-exact _SOURCE_VERIFY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Stage exact runtime-tested launcher 1.1.2 release candidate'
          git push origin HEAD:release/1.1.2
