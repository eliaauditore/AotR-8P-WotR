name: Research Signing-Clean Visual Proof

on:
  push:
    branches:
      - research/signing-clean-visual-proof-88
    paths:
      - 'launcher-source/v19-successor/BUILD_SIGNING_CLEAN_VISUAL_PROOF_V3.ps1'
      - 'launcher-source/v19-successor/resources/**'
      - 'launcher-source/v19/launcher.cs'
      - 'launcher-source/v19/VERIFY_V7_RESOURCE_CHAIN.ps1'
      - '.github/workflows/research-signing-clean-visual-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-clean-visual-proof:
    runs-on: windows-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v5

      - name: Parse proof builder with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.\launcher-source\v19-successor\BUILD_SIGNING_CLEAN_VISUAL_PROOF_V3.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
          if (@($errors).Count -gt 0) {
              $errors | Format-List *
              throw 'Signing-clean visual proof builder has PowerShell 5.1 parser errors.'
          }
          Write-Host 'SIGNING_CLEAN_VISUAL_PROOF_PS51_PARSE=PASS'

      - name: Build non-release proof in runner temp
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'aotr8p-signing-clean-visual-proof-v3'
          & '.\launcher-source\v19-successor\BUILD_SIGNING_CLEAN_VISUAL_PROOF_V3.ps1' `
              -OutputRoot $out `
              -LauncherVersion '1.1.3-signingclean-visualproof3'

          $reportPath = Join-Path $out 'SIGNING_CLEAN_VISUAL_PROOF_REPORT.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Proof report missing.' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.state -ne 'NON_RELEASE_SIGNING_CLEAN_VISUAL_PROOF') { throw "Unexpected report state: $($report.state)" }
          if ($report.strategy -ne 'GENERATED_PROJECT_NEUTRAL_VISUALS') { throw "Unexpected proof strategy: $($report.strategy)" }
          if ($report.launcher_version -ne '1.1.3-signingclean-visualproof3') { throw "Unexpected proof version: $($report.launcher_version)" }
          if ($report.public_release_modified -ne $false) { throw 'Proof claims public release mutation.' }
          if ($report.field_execution_allowed -ne $false) { throw 'Research proof must never authorize field execution.' }
          if ($report.historical_visual_files_used_as_build_inputs -ne $false) { throw 'Historical visual files were classified as build inputs.' }
          if ($report.custom_pe_icon_embedded -ne $false) { throw 'Custom PE icon unexpectedly embedded.' }

          $expectedEmbedded = @(
              'AotR8P.EngineScript',
              'AotR8P.FinalStableV7',
              'AotR8P.GuiScript',
              'AotR8P.LauncherSkin',
              'AotR8P.ReadyPatch',
              'AotR8P.Row1Patch',
              'AotR8P.Row2Patch',
              'AotR8P.Row3Patch',
              'AotR8P.V7Shellcode'
          ) | Sort-Object
          $actualEmbedded = @($report.embedded_resources | Sort-Object)
          if (($actualEmbedded -join '|') -ne ($expectedEmbedded -join '|')) {
              throw "Unexpected embedded-resource set: $($actualEmbedded -join ', ')"
          }

          $generatedHashes = @($report.generated_visual_hashes.PSObject.Properties | ForEach-Object { ([string]$_.Value).ToUpperInvariant() })
          $historicalHashes = @($report.historical_visual_hashes_forbidden.PSObject.Properties | ForEach-Object { ([string]$_.Value).ToUpperInvariant() })
          foreach ($hash in $generatedHashes) {
              if ($historicalHashes -contains $hash) { throw "Generated visual hash matches blocked historical visual: $hash" }
          }

          "PROOF_ROOT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SIGNING_CLEAN_VISUAL_PROOF_REPORT_GATE=PASS"

      - name: Hosted Defender scan without publishing proof EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:PROOF_ROOT 'AotR 8P WotR Mod SIGNING CLEAN VISUAL PROOF.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Proof EXE missing for hosted scan.' }
          $mp = @(
              "$env:ProgramFiles\Windows Defender\MpCmdRun.exe",
              "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe"
          ) | ForEach-Object { Get-Item $_ -ErrorAction SilentlyContinue } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          if (-not $mp) { throw 'Windows Defender MpCmdRun.exe unavailable.' }
          $scanLines = @(& $mp.FullName -Scan -ScanType 3 -File $exe -DisableRemediation 2>&1 | ForEach-Object { [string]$_ })
          $scanExit = $LASTEXITCODE
          $scanLines | Set-Content -LiteralPath (Join-Path $env:PROOF_ROOT 'DEFENDER_SCAN.txt') -Encoding UTF8
          if ($scanExit -ne 0) { throw "Hosted Defender scan failed with exit=$scanExit" }
          Write-Host 'SIGNING_CLEAN_VISUAL_PROOF_DEFENDER=PASS'

      - name: Prove repository stayed clean
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain)"
          if [[ -n "$dirty" ]]; then
            printf '%s\n' "$dirty"
            echo 'Research proof mutated the checked-out repository.' >&2
            exit 1
          fi
          echo 'SIGNING_CLEAN_VISUAL_PROOF_REPO_CLEAN=PASS'

      - name: Upload evidence only — never the unsigned proof EXE
        uses: actions/upload-artifact@v4
        with:
          name: signing-clean-visual-proof-report-v3
          path: |
            ${{ env.PROOF_ROOT }}/SIGNING_CLEAN_VISUAL_PROOF_REPORT.json
            ${{ env.PROOF_ROOT }}/DEFENDER_SCAN.txt
          if-no-files-found: error
          retention-days: 90
