name: Verify live accountless report once

on:
  push:
    branches:
      - release/1.1.3
    paths:
      - .github/workflows/verify-live-accountless-report-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Vercel production response headers
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -D /tmp/headers.txt -o /tmp/body.json https://a8p-direct-report.vercel.app/api/report
          cat /tmp/headers.txt
          cat /tmp/body.json
          grep -qi '^x-vercel-id:' /tmp/headers.txt
          grep -q '"service":"a8p-direct-report"' /tmp/body.json
          echo VERCEL_PRODUCTION_HEADERS_OK

      - name: Verify GitHub fallback routes resolve
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' 'https://github.com/eliaauditore/AotR-8P-WotR/issues/new?template=launcher-auto-report.md')
          case "$code" in
            200|302|303) ;;
            *) echo "Unexpected GitHub issue-create route status: $code"; exit 1;;
          esac
          code2=$(curl -sS -o /dev/null -w '%{http_code}' 'https://github.com/eliaauditore/AotR-8P-WotR')
          test "$code2" = "200"
          echo FALLBACK_ROUTES_OK
