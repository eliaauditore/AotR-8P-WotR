name: Build Launcher 1.1.3 Release Candidate

on:
  push:
    branches:
      - release/1.1.3
    paths:
      - "launcher-source/v19/**"
      - "direct-report-backend/**"
      - "direct-report.json"
      - "repair-manifest.json"
      - ".github/workflows/build-launcher-1.1.3-release-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Checkout frozen 1.1.1 donor
        uses: actions/checkout@v5
        with:
          ref: v1.1.1
          path: donor-v1.1.1
          fetch-depth: 1

      - name: Build exact 1.1.3 candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          .\launcher-source\v19\BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1 `
            -FrozenDonorRoot .\donor-v1.1.1 `
            -OutputRoot .\_RELEASE_1_1_3 `
            -LauncherVersion 1.1.3

      - name: Verify immutable runtime and direct-report GUI
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $r='.\_RELEASE_1_1_3\work\resources'
          $expected=@{
            'launcher_gui.ps1'='585E3D43B407E2E7A26D6B8B6B4D8F06952C81EA58847B21AE71BC6BC54A4A24'
            'launcher_engine.ps1'='5DB2F749F10E84322BC471FFF04E25326EFF194FA440175FE9841ED13367F938'
            'final_stable_v7.ps1'='72D00490538BE2222F5BAAF3D8A1648A86071D3A098946A7B8751E7D337300E2'
            'v7_shellcode.bin'='60EECE4660C3BA0AD183EB82B82DCDACF3ECA6DC892C8FAFCD629A92170ED45A'
          }
          foreach($n in $expected.Keys){
            $h=(Get-FileHash (Join-Path $r $n) -Algorithm SHA256).Hash.ToUpperInvariant()
            if($h -ne $expected[$n]){throw "$n drift: $h"}
          }
          $g=Get-Content (Join-Path $r 'launcher_gui.ps1') -Raw -Encoding UTF8
          foreach($t in @('SEND REPORT','OPEN GITHUB','COPY REPORT','function Send-LauncherReport {','direct-report.json','REPORT SENT')){
            if($g.IndexOf($t,[StringComparison]::Ordinal) -lt 0){throw "Direct-report GUI token missing: $t"}
          }
          foreach($bad in @('GITHUB_REPORT_TOKEN','github_pat_','ghp_','Authorization: Bearer')){
            if($g.IndexOf($bad,[StringComparison]::Ordinal) -ge 0){throw "Client secret marker found: $bad"}
          }
          Write-Host 'RELEASE_1_1_3_RUNTIME_IMMUTABILITY=PASS'
          Write-Host 'RELEASE_1_1_3_DIRECT_REPORT_GUI=PASS'

      - name: Verify live direct-report config and backend
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check .\direct-report-backend\api\report.js
          if($LASTEXITCODE -ne 0){throw 'Backend syntax invalid'}
          $cfg=Get-Content .\direct-report.json -Raw | ConvertFrom-Json
          if(-not [bool]$cfg.enabled){throw 'Direct report not enabled'}
          if([string]$cfg.endpoint -ne 'https://a8p-direct-report.vercel.app/api/report'){throw "Unexpected endpoint: $($cfg.endpoint)"}
          $health=Invoke-RestMethod -Uri ([string]$cfg.endpoint) -Method Get -TimeoutSec 15
          if(-not [bool]$health.ok -or [string]$health.service -ne 'a8p-direct-report'){throw 'Direct-report production healthcheck failed'}
          Write-Host 'RELEASE_1_1_3_DIRECT_REPORT_LIVE=PASS'

      - name: Verify exact release package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='.\_RELEASE_1_1_3'
          $pkg=Join-Path $root 'package'
          $exe=Join-Path $pkg 'AotR 8P WotR Mod.exe'
          $manifest=Get-Content (Join-Path $pkg 'manifest.json') -Raw | ConvertFrom-Json
          $repair=Get-Content (Join-Path $pkg 'repair-manifest.json') -Raw | ConvertFrom-Json
          if([string]$manifest.launcher_version -ne '1.1.3'){throw 'Manifest version mismatch'}
          if([string]$repair.generated_for_launcher -ne '1.1.3'){throw 'Repair manifest version mismatch'}
          $exeHash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToUpperInvariant()
          if([string]$manifest.launcher_sha256 -ne $exeHash){throw 'Manifest EXE hash mismatch'}
          $fvi=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe))
          if([string]$fvi.ProductVersion -ne '1.1.3'){throw "ProductVersion mismatch: $($fvi.ProductVersion)"}
          $expected=@('AotR 8P WotR Mod.exe','manifest.json','payload_paper.inc','payload_ui.big','repair-manifest.json') | Sort-Object
          $actual=@(Get-ChildItem $pkg -File | Select-Object -ExpandProperty Name | Sort-Object)
          if(($actual -join '|') -ne ($expected -join '|')){throw "Package contract mismatch: $($actual -join ', ')"}
          $defender=(Get-Content (Join-Path $root 'DEFENDER_SCAN.txt') -Raw).Trim()
          if($defender -ne 'SCANNED_CLEAN'){throw "Defender gate failed: $defender"}
          $zip=Join-Path $root 'AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip'
          $zipHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "RELEASE_1_1_3_EXE_SHA256=$exeHash"
          Write-Host "RELEASE_1_1_3_EXE_SIZE=$((Get-Item $exe).Length)"
          Write-Host "RELEASE_1_1_3_ZIP_SHA256=$zipHash"
          Write-Host 'RELEASE_1_1_3_PACKAGE_GATE=PASS'

      - name: Upload 1.1.3 release candidate
        uses: actions/upload-artifact@v4
        with:
          name: AotR-8P-WotR-1.1.3-Release-Candidate
          path: |
            _RELEASE_1_1_3/package/**
            _RELEASE_1_1_3/AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip
            _RELEASE_1_1_3/AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip.sha256.txt
            _RELEASE_1_1_3/SHA256SUMS.json
            _RELEASE_1_1_3/DEFENDER_SCAN.txt
          if-no-files-found: error
          retention-days: 7
