name: Validate Ticket System

on:
  pull_request:
  push:
    branches:
      - feature/github-ticket-system
    paths:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/**"
      - ".github/labels.yml"
      - "docs/support-bundle.schema.json"

permissions:
  contents: read

jobs:
  validate:
    name: ticket-system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Parse YAML and JSON files
        shell: python
        run: |
          from pathlib import Path
          import json
          import yaml

          yaml_files = sorted(Path(".github").rglob("*.yml")) + sorted(Path(".github").rglob("*.yaml"))
          for path in yaml_files:
              with path.open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"YAML OK: {path}")

          schema = Path("docs/support-bundle.schema.json")
          with schema.open("r", encoding="utf-8") as handle:
              json.load(handle)
          print(f"JSON OK: {schema}")
