name: Build Launcher 1.1.2 Clean Candidate V2

on:
  push:
    branches:
      - feature/launcher-1.1.2-clean-architecture
    paths:
      - ".github/workflows/build-launcher-1.1.2-clean-candidate-v2.yml"
      - "launcher-source/v19/launcher.cs"
      - "launcher-source/v19/prepare_clean_resources.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-clean-1.1.2-v2
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract and verify frozen 1.1.1 resources
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path work\frozen,work\resources,out | Out-Null

          git show 'v1.1.1:AotR 8P WotR Mod.exe' | Set-Content -LiteralPath work\frozen\BAD_TEXT_REDIRECT_DO_NOT_USE -Encoding Byte
          Remove-Item work\frozen\BAD_TEXT_REDIRECT_DO_NOT_USE -Force
          cmd /c "git show \"v1.1.1:AotR 8P WotR Mod.exe\" > \"work\frozen\donor.exe\""
          cmd /c "git show \"v1.1.1:payload_ui.big\" > \"work\frozen\payload_ui.big\""
          cmd /c "git show \"v1.1.1:payload_paper.inc\" > \"work\frozen\payload_paper.inc\""

          function Hash([string]$Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToUpperInvariant() }
          function Inflate([string]$B64,[string]$Out) {
              $packed=[Convert]::FromBase64String($B64)
              $input=New-Object IO.MemoryStream(,$packed)
              try {
                  $gzip=New-Object IO.Compression.GZipStream($input,[IO.Compression.CompressionMode]::Decompress)
                  try {
                      $output=[IO.File]::Create($Out)
                      try { $gzip.CopyTo($output) } finally { $output.Dispose() }
                  } finally { $gzip.Dispose() }
              } finally { $input.Dispose() }
          }
          function Const($Type,[string]$Name,$Flags) {
              $field=$Type.GetField($Name,$Flags)
              if(-not $field){throw "Missing const field: $Name"}
              [string]$field.GetRawConstantValue()
          }

          if((Hash 'work\frozen\donor.exe') -ne '2141EA9690708EA7A61B7298AD90E0C76CC417FED996AC0CF3685276BA2A4024'){throw 'Donor EXE hash mismatch'}
          if((Hash 'work\frozen\payload_ui.big') -ne '827988C328E010A598BFAD16C9BFF830C3F904EAF1640F162C8124E8C6ABA376'){throw 'UI hash mismatch'}
          if((Hash 'work\frozen\payload_paper.inc') -ne '3FF683843190A323DE9299C17DCD36AF24C5C00473119478E3FAF068BF904E43'){throw 'Paper hash mismatch'}

          $asm=[Reflection.Assembly]::LoadFile((Resolve-Path 'work\frozen\donor.exe').Path)
          $type=$asm.GetType('Program',$true)
          $flags=[Reflection.BindingFlags]'NonPublic,Public,Static'
          Inflate (Const $type 'Issue33SkinGzipBase64' $flags) 'work\resources\launcher_skin.png'
          Inflate (Const $type 'GuiGzipBase64' $flags) 'work\frozen\launcher_gui.ps1'
          Inflate (Const $type 'EngineGzipBase64' $flags) 'work\frozen\launcher_engine.ps1'

          $icon=[Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path 'work\frozen\donor.exe').Path)
          if(-not $icon){throw 'Could not extract icon'}
          $fs=[IO.File]::Create('work\resources\launcher.ico')
          try{$icon.Save($fs)}finally{$fs.Dispose();$icon.Dispose()}

          if((Hash 'work\resources\launcher_skin.png') -ne 'BA044C14023AAF21FC4822D068C07E8991DC6CAEDAC6BCD5F1B50935BA9C7AC6'){throw 'Skin hash mismatch'}
          if((Hash 'work\frozen\launcher_gui.ps1') -ne '23880AF22E3D0121EE79FE14CAA21799BFBE105397E4C66DC21E641D50DAD09C'){throw 'GUI hash mismatch'}
          if((Hash 'work\frozen\launcher_engine.ps1') -ne '94A71026D6A35998D0338DA0FDF9D478DDD92A76C382F23E109B13286F3F5AAA'){throw 'Engine hash mismatch'}

          $gui=Get-Content -LiteralPath 'work\frozen\launcher_gui.ps1' -Raw -Encoding UTF8
          foreach($pair in @(
            @('Row1CleanPatchBase64','row1cleanpatch.png','D4DC9A47F0E2FD9715D92F8DD4C3831B9AB95F8CA34E98937F019B7574294177'),
            @('Row2CleanPatchBase64','row2cleanpatch.png','58B9A7173CE1C9C30C85EE76D15D54E3D40B3E7E14E25D0C1FE5D8EFD89E6D8E'),
            @('Row3CleanPatchBase64','row3cleanpatch.png','7F86C02BC02D2E57D66202AF9C526D6FAE13CFC9B7CB1EFF1BB61C165B25278C'),
            @('ReadyCleanPatchBase64','readycleanpatch.png','35DCBCBE6E625C5C06EC36BAB3CA51A6F4EE29DA3DFF4CAEEDD69BC87D873DF3')
          )){
              $name=$pair[0];$file=$pair[1];$expected=$pair[2]
              $pattern='(?m)^\$'+[regex]::Escape($name)+'\s*=\s*"([^"]+)"\s*$'
              $m=[regex]::Match($gui,$pattern)
              if(-not $m.Success){throw "Could not extract $name"}
              [IO.File]::WriteAllBytes((Join-Path 'work\resources' $file),[Convert]::FromBase64String($m.Groups[1].Value))
              if((Hash (Join-Path 'work\resources' $file)) -ne $expected){throw "$file hash mismatch"}
          }

          $engine=Get-Content -LiteralPath 'work\frozen\launcher_engine.ps1' -Raw -Encoding UTF8
          $pattern='(?s)\$FinalStableV7Base64\s*=\s*@''\s*(.*?)\s*''@'
          $m=[regex]::Match($engine,$pattern)
          if(-not $m.Success){throw 'Could not extract FINAL_STABLE_V7'}
          $b64=($m.Groups[1].Value -replace '\s','')
          [IO.File]::WriteAllBytes('work\resources\final_stable_v7.ps1',[Convert]::FromBase64String($b64))
          if((Hash 'work\resources\final_stable_v7.ps1') -ne 'FEAF40B3B231646CD8F7C7099D1E8544090D5010F1C6DB06E5B2F3EF8C0C5F44'){throw 'FINAL_STABLE_V7 hash mismatch'}
          Write-Host 'FROZEN RESOURCE EXTRACTION PASS'

      - name: Transform GUI and engine to transparent clean resources
        shell: python
        run: |
          import subprocess,sys
          subprocess.check_call([sys.executable,'launcher-source/v19/prepare_clean_resources.py','work/frozen/launcher_gui.ps1','work/frozen/launcher_engine.ps1','work/resources'])

      - name: Parse transformed PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in @('work\resources\launcher_gui.ps1','work\resources\launcher_engine.ps1','work\resources\final_stable_v7.ps1')){
              $tokens=$null;$errors=$null
              [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
              if($errors.Count -gt 0){$errors|Format-List|Out-String|Write-Host;throw "PowerShell parse failed: $path"}
              Write-Host "PARSE PASS: $path"
          }

      - name: Compile managed-resource launcher 1.1.2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cs=Get-Content -LiteralPath 'launcher-source\v19\launcher.cs' -Raw -Encoding UTF8
          $cs=$cs.Replace('__LAUNCHER_VERSION__','1.1.2').Replace('__FILE_VERSION__','1.1.2.0').Replace('__UPDATE_URL__','https://raw.githubusercontent.com/eliaauditore/AotR-8P-WotR/main/manifest.json')
          if($cs -match '__[A-Z0-9_]+__'){throw 'Unresolved C# placeholder'}
          [IO.File]::WriteAllText('work\launcher.cs',$cs,(New-Object Text.UTF8Encoding($false)))
          $manifest='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="1.0.0.0" name="eliaauditore.AotR8PWotRMod.SingleExe"/><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true</dpiAware></windowsSettings></application></assembly>'
          [IO.File]::WriteAllText('work\launcher.manifest',$manifest,(New-Object Text.UTF8Encoding($false)))

          $windowsPS=Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $automation=(& $windowsPS -NoLogo -NoProfile -NonInteractive -Command '[System.Management.Automation.PSObject].Assembly.Location' | Select-Object -First 1).Trim()
          if(-not(Test-Path $automation)){throw 'Windows PowerShell automation DLL not found'}
          $csc=@((Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'),(Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'))|Where-Object{Test-Path $_}|Select-Object -First 1
          if(-not $csc){throw 'csc.exe not found'}
          $args=@('/nologo','/target:winexe','/optimize+','/platform:anycpu','/reference:System.Windows.Forms.dll','/reference:System.Web.Extensions.dll',('/reference:'+$automation),'/win32icon:work\resources\launcher.ico','/win32manifest:work\launcher.manifest','/resource:work\resources\launcher_skin.png,AotR8P.LauncherSkin','/resource:work\resources\launcher_gui.ps1,AotR8P.GuiScript','/resource:work\resources\launcher_engine.ps1,AotR8P.EngineScript','/resource:work\resources\final_stable_v7.ps1,AotR8P.FinalStableV7','/resource:work\resources\row1cleanpatch.png,AotR8P.Row1Patch','/resource:work\resources\row2cleanpatch.png,AotR8P.Row2Patch','/resource:work\resources\row3cleanpatch.png,AotR8P.Row3Patch','/resource:work\resources\readycleanpatch.png,AotR8P.ReadyPatch','/out:out\AotR 8P WotR Mod.exe','work\launcher.cs')
          & $csc @args
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'out\AotR 8P WotR Mod.exe')){throw 'C# compile failed'}
          $fvi=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path 'out\AotR 8P WotR Mod.exe'))
          if($fvi.ProductVersion -ne '1.1.2'){throw "ProductVersion mismatch: $($fvi.ProductVersion)"}
          $hash=(Get-FileHash 'out\AotR 8P WotR Mod.exe' -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "CANDIDATE_SHA256=$hash"
          Write-Host "CANDIDATE_SIZE=$((Get-Item 'out\AotR 8P WotR Mod.exe').Length)"

      - name: Verify embedded resource inventory and heuristic cleanup
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path 'out\AotR 8P WotR Mod.exe').Path
          $asm=[Reflection.Assembly]::LoadFile($exe)
          $names=@($asm.GetManifestResourceNames()|Sort-Object)
          $expected=@('AotR8P.EngineScript','AotR8P.FinalStableV7','AotR8P.GuiScript','AotR8P.LauncherSkin','AotR8P.ReadyPatch','AotR8P.Row1Patch','AotR8P.Row2Patch','AotR8P.Row3Patch')|Sort-Object
          if(($names -join '|') -ne ($expected -join '|')){throw "Resource inventory mismatch: $($names -join ', ')"}
          $ascii=[Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          foreach($forbidden in @('Issue33SkinGzipBase64','GuiGzipBase64','EngineGzipBase64','FromBase64String','GZipStream','WebClient','DownloadString')){if($ascii.Contains($forbidden)){throw "Forbidden token remains: $forbidden"}}
          Write-Host 'MANAGED RESOURCE + STATIC CLEANUP PASS'

      - name: Build exact five-file candidate ZIP
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item 'work\frozen\payload_ui.big' 'out\payload_ui.big'
          Copy-Item 'work\frozen\payload_paper.inc' 'out\payload_paper.inc'
          $launcherHash=(Get-FileHash 'out\AotR 8P WotR Mod.exe' -Algorithm SHA256).Hash.ToUpperInvariant()
          $manifest=[ordered]@{schema=1;launcher_version='1.1.2';launcher_url='https://raw.githubusercontent.com/eliaauditore/AotR-8P-WotR/main/AotR%208P%20WotR%20Mod.exe';launcher_sha256=$launcherHash;mandatory=$false;repair_manifest_url='https://raw.githubusercontent.com/eliaauditore/AotR-8P-WotR/main/repair-manifest.json';ui_url='https://raw.githubusercontent.com/eliaauditore/AotR-8P-WotR/main/payload_ui.big';ui_sha256='827988C328E010A598BFAD16C9BFF830C3F904EAF1640F162C8124E8C6ABA376';paper_url='https://raw.githubusercontent.com/eliaauditore/AotR-8P-WotR/main/payload_paper.inc';paper_sha256='3FF683843190A323DE9299C17DCD36AF24C5C00473119478E3FAF068BF904E43'}
          [IO.File]::WriteAllText('out\manifest.json',(($manifest|ConvertTo-Json -Depth 5)+[Environment]::NewLine),(New-Object Text.UTF8Encoding($false)))
          $repair=Get-Content -LiteralPath 'repair-manifest.json' -Raw -Encoding UTF8|ConvertFrom-Json
          $repair.generated_for_launcher='1.1.2'
          [IO.File]::WriteAllText('out\repair-manifest.json',(($repair|ConvertTo-Json -Depth 8)+[Environment]::NewLine),(New-Object Text.UTF8Encoding($false)))
          $files=@('AotR 8P WotR Mod.exe','manifest.json','repair-manifest.json','payload_ui.big','payload_paper.inc')
          $records=@();foreach($f in $files){$records+=[pscustomobject]@{file=$f;sha256=(Get-FileHash (Join-Path out $f) -Algorithm SHA256).Hash.ToUpperInvariant();size=(Get-Item (Join-Path out $f)).Length}}
          $records|ConvertTo-Json -Depth 4|Set-Content 'out\SHA256SUMS.json' -Encoding UTF8
          Compress-Archive -LiteralPath ($files|ForEach-Object{Join-Path out $_}) -DestinationPath 'AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip' -CompressionLevel Optimal
          $zipHash=(Get-FileHash 'AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip' -Algorithm SHA256).Hash.ToUpperInvariant()
          "$zipHash  AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip"|Set-Content 'AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip.sha256.txt' -Encoding ASCII
          Write-Host "ZIP_SHA256=$zipHash"

      - name: Microsoft Defender scan
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          $status='UNAVAILABLE'
          $mp=@("$env:ProgramFiles\Windows Defender\MpCmdRun.exe","$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe")|ForEach-Object{Get-Item $_ -ErrorAction SilentlyContinue}|Sort-Object LastWriteTime -Descending|Select-Object -First 1
          if($mp){
              $status='SCANNER_FOUND'
              & $mp.FullName -Scan -ScanType 3 -File (Resolve-Path 'out\AotR 8P WotR Mod.exe').Path -DisableRemediation
              $code=$LASTEXITCODE
              $detections=@()
              try{$detections=@(Get-MpThreatDetection -ErrorAction Stop|Where-Object{$_.Resources -match 'AotR 8P WotR Mod.exe'})}catch{}
              if($code -eq 0 -and $detections.Count -eq 0){$status='SCANNED_CLEAN'}else{$status="SCAN_ALERT_OR_ERROR|exit=$code|detections=$($detections.Count)"}
          }
          $status|Set-Content 'out\DEFENDER_SCAN.txt' -Encoding ASCII
          Write-Host "DEFENDER_STATUS=$status"
          if($status -like 'SCAN_ALERT_OR_ERROR*'){throw $status}

      - name: Upload clean candidate
        uses: actions/upload-artifact@v4
        with:
          name: AotR-8P-WotR-1.1.2-Clean-Candidate-V2
          path: |
            AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip
            AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip.sha256.txt
            out/SHA256SUMS.json
            out/DEFENDER_SCAN.txt
          retention-days: 7
