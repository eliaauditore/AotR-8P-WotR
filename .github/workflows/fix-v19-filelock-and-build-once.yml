name: Fix V19 File Lock and Build Once

on:
  push:
    branches:
      - feature/launcher-1.1.2-clean-architecture
    paths:
      - ".github/workflows/fix-v19-filelock-and-build-once.yml"

permissions:
  contents: write

jobs:
  fix-and-build:
    name: fix-filelock-and-build-1.1.2
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/launcher-1.1.2-clean-architecture
          fetch-depth: 1

      - name: Fix reflection file lock in V19 runner
        shell: python
        run: |
          from pathlib import Path
          p = Path('launcher-source/v19/BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1')
          text = p.read_text(encoding='utf-8-sig')
          old = '$candidateAsm = [Reflection.Assembly]::LoadFile($Exe)'
          new = '$candidateAsm = [Reflection.Assembly]::Load([IO.File]::ReadAllBytes($Exe))'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one file-lock anchor, found {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

      - name: Commit source fix to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher-source/v19/BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1
          git commit -m "Launcher 1.1.2: avoid locking candidate during resource inspection"
          git push origin HEAD:feature/launcher-1.1.2-clean-architecture

      - name: Checkout frozen 1.1.1 donor
        uses: actions/checkout@v5
        with:
          ref: v1.1.1
          path: donor-v1.1.1
          fetch-depth: 1

      - name: Build, package, and Defender-scan candidate
        shell: powershell
        run: |
          $FinalStableV7Base64 = '$FinalStableV7Base64'
          .\launcher-source\v19\BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1 `
            -FrozenDonorRoot .\donor-v1.1.1 `
            -OutputRoot .\_V19_1_1_2_BUILD `
            -LauncherVersion 1.1.2

      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: AotR-8P-WotR-1.1.2-Clean-Candidate-FileLockFixed
          path: |
            _V19_1_1_2_BUILD/AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip
            _V19_1_1_2_BUILD/AotR_8P_War_of_the_Ring_1.1.2_Clean_Candidate.zip.sha256.txt
            _V19_1_1_2_BUILD/SHA256SUMS.json
            _V19_1_1_2_BUILD/DEFENDER_SCAN.txt
          if-no-files-found: error
          retention-days: 7
