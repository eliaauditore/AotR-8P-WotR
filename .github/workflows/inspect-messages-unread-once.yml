name: Inspect 1.1.5 Messages Unread Once

on:
  push:
    branches:
      - hotfix/messages-unread-state
    paths:
      - '.github/workflows/inspect-messages-unread-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inspect PowerShell 5.1 comment JSON shape
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Net.Http
          $client=New-Object System.Net.Http.HttpClient
          $client.Timeout=[TimeSpan]::FromSeconds(30)
          $client.DefaultRequestHeaders.UserAgent.ParseAdd('AotR-8P-WotR-Launcher/1.1.5-CI')
          $client.DefaultRequestHeaders.Accept.ParseAdd('application/vnd.github+json')
          $r=$client.GetAsync('https://api.github.com/repos/eliaauditore/AotR-8P-WotR/issues/78/comments?per_page=100').GetAwaiter().GetResult()
          [void]$r.EnsureSuccessStatusCode()
          $raw=$r.Content.ReadAsStringAsync().GetAwaiter().GetResult()
          $parsed=$raw | ConvertFrom-Json
          Write-Host "PARSED_TYPE=$($parsed.GetType().FullName)"
          Write-Host "PARSED_AT_COUNT=$(@($parsed).Count)"
          $idx=0
          foreach($x in @($parsed)){
            Write-Host "ITEM[$idx]_TYPE=$($x.GetType().FullName)"
            Write-Host "ITEM[$idx]_ID=$([string]$x.id)"
            Write-Host "ITEM[$idx]_ASSOC=$([string]$x.author_association)"
            Write-Host "ITEM[$idx]_USER=$([string]$x.user.login)"
            $idx++
          }
          $allowed=@('OWNER','MEMBER','COLLABORATOR')
          $legacy=@($parsed | Where-Object {
            $body=[string]$_.body
            ($allowed -contains [string]$_.author_association) -and
            -not $body.Contains('<!-- no-broadcast -->') -and
            -not $body.TrimStart().StartsWith('[internal]',[StringComparison]::OrdinalIgnoreCase)
          } | Sort-Object id)
          Write-Host "LEGACY_FILTER_COUNT=$($legacy.Count)"
          $flat=@(@($parsed) | ForEach-Object { $_ } | Where-Object {
            $body=[string]$_.body
            ($allowed -contains [string]$_.author_association) -and
            -not $body.Contains('<!-- no-broadcast -->') -and
            -not $body.TrimStart().StartsWith('[internal]',[StringComparison]::OrdinalIgnoreCase)
          } | Sort-Object id)
          Write-Host "FLAT_FILTER_COUNT=$($flat.Count)"
          foreach($x in $flat){Write-Host "FLAT_ID=$($x.id) ASSOC=$($x.author_association)"}
          $r.Dispose();$client.Dispose()
