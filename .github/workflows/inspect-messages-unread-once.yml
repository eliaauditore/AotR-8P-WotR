name: Inspect 1.1.5 Messages Unread Once

on:
  push:
    branches:
      - hotfix/messages-unread-state
    paths:
      - '.github/workflows/inspect-messages-unread-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Isolate exact embedded message fetch return path
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Net.Http
          $exe=(Resolve-Path '.\AotR 8P WotR Mod.exe').Path
          $asm=[Reflection.Assembly]::Load([IO.File]::ReadAllBytes($exe))
          $s=$asm.GetManifestResourceStream('AotR8P.GuiScript')
          if(-not $s){throw 'GUI resource missing'}
          $gui=Join-Path $env:RUNNER_TEMP 'launcher_gui_115.ps1'
          try{$o=[IO.File]::Create($gui);try{$s.CopyTo($o)}finally{$o.Dispose()}}finally{$s.Dispose()}
          $tokens=$null;$errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($gui,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw $errors[0].Message}
          $wanted=@{}
          foreach($n in @('Get-HttpText','Load-SupportState','Save-SupportState','Resolve-MasterIssue','Get-MaintainerMessages','Refresh-SupportMessages')){$wanted[$n]=$true}
          $funcs=@($ast.FindAll({param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $wanted.ContainsKey($node.Name)},$true))
          if($funcs.Count -ne 6){throw "function extraction mismatch: $($funcs.Count)"}
          foreach($f in $funcs | Sort-Object Name){Write-Host "FUNCTION=$($f.Name)"; if($f.Name -eq 'Get-HttpText'){Write-Host $f.Extent.Text}}
          $fn=Join-Path $env:RUNNER_TEMP 'messages-live-functions.ps1'
          [IO.File]::WriteAllText($fn,(($funcs|ForEach-Object{$_.Extent.Text})-join "`r`n`r`n"),(New-Object Text.UTF8Encoding($false)))
          . $fn
          function Set-MessagesIndicator {}
          function Write-RepairLog([string]$Text){Write-Host "REPAIRLOG: $Text"}

          $script:HttpClient=New-Object System.Net.Http.HttpClient
          $script:HttpClient.Timeout=[TimeSpan]::FromSeconds(30)
          $script:HttpClient.DefaultRequestHeaders.UserAgent.ParseAdd('AotR-8P-WotR-Launcher/1.1.5-CI')
          $script:HttpClient.DefaultRequestHeaders.Accept.ParseAdd('application/vnd.github+json')
          $script:GitHubApiRoot='https://api.github.com/repos/eliaauditore/AotR-8P-WotR'
          $script:SupportStatePath=Join-Path $env:RUNNER_TEMP 'support_state_78.json'
          $seed=[ordered]@{schema=1;fingerprint='A8P-FP-53730198C7CD';master_issue=0;last_seen_message_id=0;latest_message_id=0;last_checked=''}
          [IO.File]::WriteAllText($script:SupportStatePath,($seed|ConvertTo-Json -Depth 4),(New-Object Text.UTF8Encoding($false)))
          $script:SupportState=$null

          $url="$script:GitHubApiRoot/issues/78/comments?per_page=100"
          Write-Host "URL=$url"
          $viaExact=Get-HttpText $url
          Write-Host "HTTP_TEXT_TYPE=$($viaExact.GetType().FullName)"
          Write-Host "HTTP_TEXT_LENGTH=$($viaExact.Length)"
          Write-Host "HTTP_TEXT_PREFIX=$($viaExact.Substring(0,[Math]::Min(100,$viaExact.Length)))"
          $viaParsed=$viaExact | ConvertFrom-Json
          Write-Host "VIA_PARSED_COUNT=$(@($viaParsed).Count)"
          $allowed=@('OWNER','MEMBER','COLLABORATOR')
          $viaFiltered=@($viaParsed | Where-Object {
            $body=[string]$_.body
            ($allowed -contains [string]$_.author_association) -and
            -not $body.Contains('<!-- no-broadcast -->') -and
            -not $body.TrimStart().StartsWith('[internal]',[StringComparison]::OrdinalIgnoreCase)
          } | Sort-Object id)
          Write-Host "VIA_FILTERED_COUNT=$($viaFiltered.Count)"
          foreach($m in $viaFiltered){Write-Host "VIA_FILTERED_ID=$($m.id)"}

          $directFunction=@(Get-MaintainerMessages 78)
          Write-Host "DIRECT_FUNCTION_COUNT=$($directFunction.Count)"
          foreach($m in $directFunction){Write-Host "DIRECT_FUNCTION_ID=$($m.id)"}

          $script:SupportState=Load-SupportState
          $messages=@(Refresh-SupportMessages)
          Write-Host "REFRESH_COUNT=$($messages.Count)"
          Write-Host "MASTER=$($script:SupportState['master_issue'])"
          Write-Host "LATEST=$($script:SupportState['latest_message_id'])"
          Write-Host "SEEN=$($script:SupportState['last_seen_message_id'])"

          if($viaFiltered.Count -ne 2){throw "exact Get-HttpText/filter expected 2, got $($viaFiltered.Count)"}
          if($directFunction.Count -ne 2){throw "Get-MaintainerMessages expected 2, got $($directFunction.Count)"}
          if($messages.Count -ne 2){throw "Refresh-SupportMessages expected 2, got $($messages.Count)"}
