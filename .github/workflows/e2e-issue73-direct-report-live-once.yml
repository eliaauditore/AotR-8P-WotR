name: E2E Issue73 Direct Report Live Once

on:
  push:
    branches:
      - feature/accountless-direct-report
    paths:
      - .github/workflows/e2e-issue73-direct-report-live-once.yml

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Healthcheck public direct-report endpoint
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://a8p-direct-report.vercel.app/api/report'
          body="$(mktemp)"
          code="$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' "$endpoint")"
          echo "GET status: $code"
          cat "$body"
          test "$code" = '200'
          grep -q '"ok":true' "$body"
          grep -q 'a8p-direct-report' "$body"

      - name: Submit synthetic accountless report
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://a8p-direct-report.vercel.app/api/report'
          payload="$(mktemp)"
          response="$(mktemp)"
          cat > "$payload" <<'JSON'
          {
            "title": "Synthetic accountless direct-report E2E validation",
            "exact_error": "Synthetic accountless direct-report E2E validation for issue #73. No game files were modified.",
            "support_bundle": {
              "schema": 1,
              "launcher_version": "1.1.2-e2e-direct-report",
              "error_code": "A8P-TEST-002",
              "fingerprint": "A8P-FP-73ACCE551E2E",
              "timestamp": "2026-08-28T04:59:48Z",
              "windows": "Synthetic CI runner - no player device data",
              "aotr_version": "synthetic",
              "language": "en",
              "files": [],
              "repair_plan": {
                "source_error_code": "A8P-TEST-002",
                "actions": ["retry_launch"]
              },
              "repair_attempts": [],
              "last_retry": null,
              "last_error": "Synthetic accountless direct-report E2E validation for issue #73. No game files were modified.",
              "log_files": []
            }
          }
          JSON

          code="$(curl --silent --show-error --location \
            --request POST \
            --header 'content-type: application/json' \
            --data-binary "@$payload" \
            --output "$response" \
            --write-out '%{http_code}' \
            "$endpoint")"

          echo "POST status: $code"
          cat "$response"
          test "$code" = '201'
          grep -q '"ok":true' "$response"
          grep -q '"issue_number"' "$response"
          grep -q 'A8P-FP-73ACCE551E2E' "$response"

          echo '### Live accountless report E2E' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "- Endpoint: $endpoint" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTTP: $code" >> "$GITHUB_STEP_SUMMARY"
          echo '- Fingerprint: `A8P-FP-73ACCE551E2E`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Response:' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$response" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
