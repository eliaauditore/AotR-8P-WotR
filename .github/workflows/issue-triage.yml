name: Issue Triage

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: a8p-issue-processing
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure labels, assign ticket metadata, and classify issue
        uses: actions/github-script@v8
        with:
          script: |
            const crypto = require("crypto");

            const labels = {
              "bug": ["d73a4a", "Confirmed or suspected defect"],
              "multiplayer": ["0052cc", "LAN or Network WotR multiplayer"],
              "sync": ["5319e7", "Mismatch, OOS, state divergence, or synchronization"],
              "launcher": ["1d76db", "Standalone launcher behavior"],
              "launcher-report": ["0366d6", "Report opened from the launcher after auto-repair failed"],
              "master-ticket": ["6f42c1", "Canonical issue for one support fingerprint/error cluster"],
              "cluster-member": ["bfd4f2", "Individual report linked to a master ticket"],
              "needs-retest": ["fef2c0", "Maintainer asked affected players to verify a proposed fix"],
              "payload": ["0e8a16", "Packaged payload integrity or deployment"],
              "ui": ["c5def5", "WotR or launcher UI"],
              "paper": ["bfdadc", "PaperScenario or payload_paper.inc"],
              "auto-repair": ["fbca04", "Launcher automatic repair system"],
              "compatibility": ["f9d0c4", "Version, language, Windows, or compatibility issue"],
              "engine": ["b60205", "Game engine or runtime behavior"],
              "needs-triage": ["ededed", "New issue awaiting classification"],
              "needs-logs": ["d4c5f9", "More logs or a support bundle are required"],
              "duplicate": ["cfd3d7", "Same root cause as an existing ticket"],
              "confirmed": ["0e8a16", "Reproduced or otherwise confirmed"],
              "cannot-reproduce": ["e4e669", "Current evidence is insufficient to reproduce"],
              "fixed": ["0e8a16", "Fix is implemented and verified"],
              "feature": ["a2eeef", "Enhancement request"],
              "priority:critical": ["b60205", "Blocks launch, corrupts state, or widespread critical failure"],
              "priority:high": ["d93f0b", "Major defect with significant user impact"],
              "priority:medium": ["fbca04", "Important but non-critical"],
              "priority:low": ["0e8a16", "Minor impact or low urgency"]
            };

            const { owner, repo } = context.repo;

            for (const [name, [color, description]] of Object.entries(labels)) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            if (!context.payload.issue) {
              core.info("Label catalog synchronized; no issue payload to classify.");
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: context.payload.issue.number
            });

            if (issue.pull_request) return;

            const title = issue.title || "";
            let body = issue.body || "";
            const ticketId = `A8P-TICKET-${String(issue.number).padStart(4, "0")}`;

            let fingerprintMatch = body.match(/\bA8P-FP-[A-F0-9]{12}\b/i);
            let fingerprint = fingerprintMatch ? fingerprintMatch[0].toUpperCase() : null;

            if (!fingerprint) {
              const errorCodeMatch = body.match(/\bA8P-(?!FP-)[A-Z0-9]+(?:-[A-Z0-9]+)*-[0-9]{3}\b/i);
              const errorSectionMatch = body.match(/###\s+(?:Exact error(?: \/ visible state)?|Exact error message|Original error)\s*\n+([\s\S]*?)(?=\n###\s|\s*$)/i);

              if (errorCodeMatch && errorSectionMatch) {
                const normalizedError = errorSectionMatch[1]
                  .replace(/```(?:text)?/gi, "")
                  .replace(/```/g, "")
                  .trim()
                  .toLowerCase()
                  .replace(/\s+/g, " ");

                if (normalizedError) {
                  const signature = `${errorCodeMatch[0].toUpperCase()}|${normalizedError}`;
                  fingerprint = `A8P-FP-${crypto.createHash("sha256").update(signature, "utf8").digest("hex").slice(0, 12).toUpperCase()}`;
                }
              }
            }

            const metadataMarker = "<!-- a8p-ticket-metadata -->";
            let desiredBody = body;
            if (!desiredBody.includes(metadataMarker)) {
              const metadata = [
                metadataMarker,
                `**Ticket ID:** \`${ticketId}\``,
                fingerprint ? `**Support Fingerprint:** \`${fingerprint}\`` : null,
                ""
              ].filter(value => value !== null).join("  \n");
              desiredBody = `${metadata}\n${desiredBody}`;
            } else if (fingerprint && !/\bA8P-FP-[A-F0-9]{12}\b/i.test(desiredBody)) {
              desiredBody = desiredBody.replace(
                /\*\*Ticket ID:\*\*\s*`A8P-TICKET-[0-9]{4,}`/i,
                match => `${match}  \n**Support Fingerprint:** \`${fingerprint}\``
              );
            }

            if (desiredBody !== body) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                body: desiredBody
              });
              body = desiredBody;
            }

            const haystack = `${title}\n${body}`;
            const add = new Set(["needs-triage"]);

            if (title.startsWith("[Bug]")) {
              add.add("bug");
              add.add("launcher");
            }
            if (title.startsWith("[Multiplayer]")) {
              add.add("bug");
              add.add("multiplayer");
              add.add("sync");
            }
            if (title.startsWith("[Auto-Repair]")) {
              add.add("bug");
              add.add("auto-repair");
              add.add("launcher");
            }
            if (title.startsWith("[Launcher Report]")) {
              add.add("bug");
              add.add("launcher");
              add.add("auto-repair");
              add.add("launcher-report");
            }
            if (title.startsWith("[Feature]")) {
              add.add("feature");
            }

            if (/A8P-PAYLOAD-UI-[A-Z0-9-]*/i.test(haystack)) {
              add.add("payload");
              add.add("ui");
            }
            if (/A8P-PAYLOAD-PAPER-[A-Z0-9-]*/i.test(haystack)) {
              add.add("payload");
              add.add("paper");
            }
            if (/A8P-COMPAT-[A-Z0-9-]*/i.test(haystack)) {
              add.add("compatibility");
            }
            if (/A8P-ENGINE-[A-Z0-9-]*/i.test(haystack)) {
              add.add("engine");
            }
            if (/A8P-(INSTALL|LEGACY|PROCESS|RUNTIME|GAMEPROC|PERMISSION)-[A-Z0-9-]*/i.test(haystack)) {
              add.add("launcher");
            }

            if (/\bmismatch\b|out[ -]?of[ -]?sync|\boos\b|starting\.\.\.|direct launch failed|host\/client|network wotr|\blan\b/i.test(haystack)) {
              add.add("multiplayer");
              add.add("sync");
            }

            const hasFingerprint = Boolean(fingerprint) || /\bA8P-FP-[A-F0-9]{12}\b/i.test(body);
            const hasSupportBundle = /"schema"\s*:\s*1/i.test(body) && /"repair_attempts"\s*:/i.test(body);

            if (!hasFingerprint && (add.has("auto-repair") || add.has("multiplayer"))) {
              add.add("needs-logs");
            }
            if (add.has("launcher-report") && !hasSupportBundle) {
              add.add("needs-logs");
            }

            const { data: latest } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issue.number
            });
            const latestLabels = (latest.labels || []).map(label => typeof label === "string" ? label : label.name);
            const isClusterChild = latestLabels.includes("cluster-member") || latestLabels.includes("duplicate");
            if (isClusterChild) add.delete("needs-triage");

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issue.number,
              labels: [...add]
            });

            if (isClusterChild) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: "needs-triage" });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            core.info(`Assigned ${ticketId}${fingerprint ? ` / ${fingerprint}` : ""}${isClusterChild ? " / clustered child" : ""}`);
