name: Issue Triage

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Triage, fingerprint, and cluster issue
        uses: actions/github-script@v8
        with:
          script: |
            const crypto = require("crypto");
            const { owner, repo } = context.repo;

            const labels = {
              "bug": ["d73a4a", "Confirmed or suspected defect"],
              "multiplayer": ["0052cc", "LAN or Network WotR multiplayer"],
              "sync": ["5319e7", "Mismatch, OOS, state divergence, or synchronization"],
              "launcher": ["1d76db", "Standalone launcher behavior"],
              "launcher-report": ["0366d6", "Report opened from the launcher after auto-repair failed"],
              "master-ticket": ["6f42c1", "Canonical issue for one support fingerprint/error cluster"],
              "cluster-member": ["bfd4f2", "Individual report linked to a master ticket"],
              "needs-retest": ["fef2c0", "Maintainer asked affected players to verify a proposed fix"],
              "payload": ["0e8a16", "Packaged payload integrity or deployment"],
              "ui": ["c5def5", "WotR or launcher UI"],
              "paper": ["bfdadc", "PaperScenario or payload_paper.inc"],
              "auto-repair": ["fbca04", "Launcher automatic repair system"],
              "compatibility": ["f9d0c4", "Version, language, Windows, or compatibility issue"],
              "engine": ["b60205", "Game engine or runtime behavior"],
              "needs-triage": ["ededed", "New issue awaiting classification"],
              "needs-logs": ["d4c5f9", "More logs or a support bundle are required"],
              "duplicate": ["cfd3d7", "Same root cause as an existing ticket"],
              "confirmed": ["0e8a16", "Reproduced or otherwise confirmed"],
              "cannot-reproduce": ["e4e669", "Current evidence is insufficient to reproduce"],
              "fixed": ["0e8a16", "Fix is implemented and verified"],
              "feature": ["a2eeef", "Enhancement request"],
              "priority:critical": ["b60205", "Blocks launch, corrupts state, or widespread critical failure"],
              "priority:high": ["d93f0b", "Major defect with significant user impact"],
              "priority:medium": ["fbca04", "Important but non-critical"],
              "priority:low": ["0e8a16", "Minor impact or low urgency"]
            };

            for (const [name, [color, description]] of Object.entries(labels)) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            if (!context.payload.issue) {
              core.info("Label catalog synchronized; no issue payload to process.");
              return;
            }

            const ticketId = number => `A8P-TICKET-${String(number).padStart(4, "0")}`;
            const labelNames = item => (item.labels || []).map(label => typeof label === "string" ? label : label.name);

            const resolveFingerprint = text => {
              const source = text || "";
              const direct = source.match(/\bA8P-FP-[A-F0-9]{12}\b/i);
              if (direct) return direct[0].toUpperCase();

              const errorCodeMatch = source.match(/\bA8P-(?!FP-)[A-Z0-9]+(?:-[A-Z0-9]+)*-[0-9]{3}\b/i);
              const errorSectionMatch = source.match(/###\s+(?:Exact error(?: \/ visible state)?|Exact error message|Original error)\s*\n+([\s\S]*?)(?=\n###\s|\s*$)/i);
              if (!errorCodeMatch || !errorSectionMatch) return null;

              const normalizedError = errorSectionMatch[1]
                .replace(/```(?:text)?/gi, "")
                .replace(/```/g, "")
                .trim()
                .toLowerCase()
                .replace(/\s+/g, " ");
              if (!normalizedError) return null;

              const signature = `${errorCodeMatch[0].toUpperCase()}|${normalizedError}`;
              return `A8P-FP-${crypto.createHash("sha256").update(signature, "utf8").digest("hex").slice(0, 12).toUpperCase()}`;
            };

            const removeLabel = async (issueNumber, label) => {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };

            const upsertBlock = (body, start, end, block) => {
              const source = body || "";
              const startIndex = source.indexOf(start);
              const endIndex = source.indexOf(end);
              if (startIndex !== -1 && endIndex !== -1 && endIndex >= startIndex) {
                return `${source.slice(0, startIndex)}${block}${source.slice(endIndex + end.length)}`;
              }
              return `${source.trimEnd()}\n\n${block}\n`;
            };

            // Read fresh server state instead of trusting the event snapshot.
            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: context.payload.issue.number
            });
            if (issue.pull_request) return;

            const title = issue.title || "";
            let body = issue.body || "";
            const currentTicketId = ticketId(issue.number);
            const fingerprint = resolveFingerprint(body);

            // Stable ticket metadata. If the launcher omitted a fingerprint, the
            // fallback generated above is written before clustering.
            const metadataMarker = "<!-- a8p-ticket-metadata -->";
            let desiredBody = body;
            if (!desiredBody.includes(metadataMarker)) {
              const metadata = [
                metadataMarker,
                `**Ticket ID:** \`${currentTicketId}\``,
                fingerprint ? `**Support Fingerprint:** \`${fingerprint}\`` : null,
                ""
              ].filter(value => value !== null).join("  \n");
              desiredBody = `${metadata}\n${desiredBody}`;
            } else if (fingerprint && !/\bA8P-FP-[A-F0-9]{12}\b/i.test(desiredBody)) {
              desiredBody = desiredBody.replace(
                /\*\*Ticket ID:\*\*\s*`A8P-TICKET-[0-9]{4,}`/i,
                match => `${match}  \n**Support Fingerprint:** \`${fingerprint}\``
              );
            }

            if (desiredBody !== body) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body: desiredBody });
              body = desiredBody;
            }

            // Normal issue classification happens before clustering.
            const haystack = `${title}\n${body}`;
            const add = new Set(["needs-triage"]);

            if (title.startsWith("[Bug]")) {
              add.add("bug");
              add.add("launcher");
            }
            if (title.startsWith("[Multiplayer]")) {
              add.add("bug");
              add.add("multiplayer");
              add.add("sync");
            }
            if (title.startsWith("[Auto-Repair]")) {
              add.add("bug");
              add.add("auto-repair");
              add.add("launcher");
            }
            if (title.startsWith("[Launcher Report]")) {
              add.add("bug");
              add.add("launcher");
              add.add("auto-repair");
              add.add("launcher-report");
            }
            if (title.startsWith("[Feature]")) add.add("feature");

            if (/A8P-PAYLOAD-UI-[A-Z0-9-]*/i.test(haystack)) {
              add.add("payload");
              add.add("ui");
            }
            if (/A8P-PAYLOAD-PAPER-[A-Z0-9-]*/i.test(haystack)) {
              add.add("payload");
              add.add("paper");
            }
            if (/A8P-COMPAT-[A-Z0-9-]*/i.test(haystack)) add.add("compatibility");
            if (/A8P-ENGINE-[A-Z0-9-]*/i.test(haystack)) add.add("engine");
            if (/A8P-(INSTALL|LEGACY|PROCESS|RUNTIME|GAMEPROC|PERMISSION)-[A-Z0-9-]*/i.test(haystack)) add.add("launcher");

            if (/\bmismatch\b|out[ -]?of[ -]?sync|\boos\b|starting\.\.\.|direct launch failed|host\/client|network wotr|\blan\b/i.test(haystack)) {
              add.add("multiplayer");
              add.add("sync");
            }

            const hasSupportBundle = /"schema"\s*:\s*1/i.test(body) && /"repair_attempts"\s*:/i.test(body);
            if (!fingerprint && (add.has("auto-repair") || add.has("multiplayer"))) add.add("needs-logs");
            if (add.has("launcher-report") && !hasSupportBundle) add.add("needs-logs");

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issue.number,
              labels: [...add]
            });

            if (!fingerprint) {
              core.info(`Processed ${currentTicketId}; no stable fingerprint available for clustering.`);
              return;
            }

            // No repository-wide Actions concurrency group is used here. GitHub may
            // discard intermediate pending runs in a shared concurrency group during
            // report bursts. Instead every report runs, and clustering converges on
            // the deterministic oldest issue number for this fingerprint.
            const allItems = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100
            });

            let candidates = allItems
              .filter(item => !item.pull_request)
              .filter(item => resolveFingerprint(item.body) === fingerprint);

            if (!candidates.some(item => item.number === issue.number)) candidates.push(issue);

            const existingMasters = candidates
              .filter(item => labelNames(item).includes("master-ticket"))
              .sort((a, b) => a.number - b.number);

            const master = existingMasters[0] || [...candidates].sort((a, b) => a.number - b.number)[0];
            const masterId = ticketId(master.number);
            const masterUrl = `https://github.com/${owner}/${repo}/issues/${master.number}`;

            await github.rest.issues.addLabels({ owner, repo, issue_number: master.number, labels: ["master-ticket"] });
            await removeLabel(master.number, "cluster-member");
            await removeLabel(master.number, "duplicate");
            for (const extraMaster of existingMasters.slice(1)) await removeLabel(extraMaster.number, "master-ticket");

            if (
              master.state === "closed" &&
              issue.number !== master.number &&
              issue.state === "open" &&
              ["opened", "reopened"].includes(context.payload.action)
            ) {
              await github.rest.issues.update({ owner, repo, issue_number: master.number, state: "open" });
              await removeLabel(master.number, "fixed");
              await github.rest.issues.addLabels({ owner, repo, issue_number: master.number, labels: ["needs-triage"] });
            }

            candidates = [...candidates].sort((a, b) => a.number - b.number);

            // Build the visible cluster from the fresh master state plus all reports
            // observed by this run. Unioning prior rows makes concurrent runs
            // monotonic: a slower earlier run cannot shrink a newer cluster block.
            const clusterStart = "<!-- a8p-cluster-start -->";
            const clusterEnd = "<!-- a8p-cluster-end -->";
            const { data: freshMaster } = await github.rest.issues.get({ owner, repo, issue_number: master.number });
            const clusterNumbers = new Set(candidates.map(item => item.number));
            clusterNumbers.add(master.number);

            const existingBlockStart = (freshMaster.body || "").indexOf(clusterStart);
            const existingBlockEnd = (freshMaster.body || "").indexOf(clusterEnd);
            if (existingBlockStart !== -1 && existingBlockEnd > existingBlockStart) {
              const existingBlock = (freshMaster.body || "").slice(existingBlockStart, existingBlockEnd + clusterEnd.length);
              for (const match of existingBlock.matchAll(/A8P-TICKET-([0-9]{4,})/g)) {
                clusterNumbers.add(Number(match[1]));
              }
            }

            const sortedClusterNumbers = [...clusterNumbers].sort((a, b) => a - b);
            const clusterRows = sortedClusterNumbers.map(number => {
              const role = number === master.number ? " **MASTER**" : " report";
              return `- \`${ticketId(number)}\` — #${number}${role}`;
            });
            const clusterBlock = [
              clusterStart,
              "### Error cluster",
              `- **Master:** \`${masterId}\` (#${master.number})`,
              `- **Fingerprint:** \`${fingerprint}\``,
              `- **Affected reports:** ${sortedClusterNumbers.length}`,
              "",
              ...clusterRows,
              clusterEnd
            ].join("\n");

            const newMasterBody = upsertBlock(freshMaster.body, clusterStart, clusterEnd, clusterBlock);
            if (newMasterBody !== (freshMaster.body || "")) {
              await github.rest.issues.update({ owner, repo, issue_number: master.number, body: newMasterBody });
            }

            if (sortedClusterNumbers.length >= 2) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: master.number, labels: ["confirmed"] });
            }

            for (const item of candidates) {
              if (item.number === master.number) continue;

              const { data: child } = await github.rest.issues.get({ owner, repo, issue_number: item.number });

              // Only a report's own workflow run edits its report body. This avoids
              // cross-report body write races while still allowing any run to apply
              // cluster lifecycle labels/closure.
              if (child.number === issue.number) {
                let childBody = child.body || "";
                const linkStart = "<!-- a8p-master-link-start -->";
                const linkEnd = "<!-- a8p-master-link-end -->";
                const linkBlock = [
                  linkStart,
                  `> Clustered under master **${masterId}**: ${masterUrl}`,
                  `> Fingerprint: \`${fingerprint}\`. Maintainer updates from the master are mirrored to this report.`,
                  linkEnd
                ].join("\n");
                childBody = upsertBlock(childBody, linkStart, linkEnd, linkBlock);

                if (childBody !== (child.body || "")) {
                  await github.rest.issues.update({ owner, repo, issue_number: child.number, body: childBody });
                }
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: child.number,
                labels: ["cluster-member", "duplicate"]
              });
              await removeLabel(child.number, "master-ticket");
              await removeLabel(child.number, "needs-triage");

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: child.number,
                per_page: 100
              });
              if (!comments.some(comment => (comment.body || "").includes("<!-- a8p-cluster-link -->"))) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: child.number,
                  body: [
                    "<!-- a8p-cluster-link -->",
                    `This report is part of the same error class as **${masterId}** (#${master.number}).`,
                    "All maintainer updates on the master ticket will be mirrored here automatically.",
                    `Master: ${masterUrl}`
                  ].join("\n\n")
                });
              }

              if (child.state !== "closed") {
                await github.rest.issues.update({ owner, repo, issue_number: child.number, state: "closed" });
              }
              await removeLabel(child.number, "needs-triage");
            }

            core.info(`Processed ${currentTicketId}; cluster ${fingerprint}: master ${masterId}, at least ${sortedClusterNumbers.length} affected report(s).`);
