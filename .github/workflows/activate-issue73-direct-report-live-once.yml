name: Activate Issue73 Direct Report Live Once

on:
  push:
    branches:
      - feature/accountless-direct-report
    paths:
      - .github/workflows/activate-issue73-direct-report-live-once.yml

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/accountless-direct-report
          fetch-depth: 0

      - name: Activate production direct-report endpoint and permanent live gate
        shell: python
        run: |
          import json
          from pathlib import Path

          endpoint = 'https://a8p-direct-report.vercel.app/api/report'

          cfg_path = Path('direct-report.json')
          cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['schema'] = 1
          cfg['enabled'] = True
          cfg['endpoint'] = endpoint
          cfg_path.write_text(json.dumps(cfg, indent=2) + '\n', encoding='utf-8')

          wf_path = Path('.github/workflows/validate-issue73-direct-report.yml')
          text = wf_path.read_text(encoding='utf-8')
          old = """          if([bool]$cfg.enabled){throw 'Production config enabled before live backend acceptance'}
          if(-not [string]::IsNullOrWhiteSpace([string]$cfg.endpoint)){throw 'Disabled production config contains endpoint'}
          Write-Host 'ISSUE73_DISABLED_UNTIL_LIVE_GATE=PASS'
"""
          new = """          if(-not [bool]$cfg.enabled){throw 'Production direct-report config is not enabled after live E2E acceptance'}
          if([string]$cfg.endpoint -ne 'https://a8p-direct-report.vercel.app/api/report'){throw ('Unexpected production direct-report endpoint: '+[string]$cfg.endpoint)}
          if(-not ([string]$cfg.endpoint).StartsWith('https://',[StringComparison]::OrdinalIgnoreCase)){throw 'Production direct-report endpoint is not HTTPS'}
          Write-Host 'ISSUE73_LIVE_ENDPOINT_GATE=PASS'
"""
          if old not in text:
              raise SystemExit('expected disabled-config gate not found')
          wf_path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit live activation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add direct-report.json .github/workflows/validate-issue73-direct-report.yml
          git diff --cached --check
          git commit -m 'Activate accountless direct reporting after live E2E'
          git push origin HEAD:feature/accountless-direct-report
