name: Inspect Issue78 Engine Once

on:
  push:
    branches:
      - hotfix/external-drive-link-fallback
    paths:
      - .github/workflows/inspect-issue78-engine-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extract exact runtime and repair functions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path '.\AotR 8P WotR Mod.exe').Path
          $asm = [Reflection.Assembly]::LoadFile($exe)

          function Read-Resource([string]$Name,[string]$OutName) {
            $stream = $asm.GetManifestResourceStream($Name)
            if (-not $stream) { throw "$Name resource missing" }
            $reader = New-Object IO.StreamReader($stream,[Text.Encoding]::UTF8,$true)
            try { $text = $reader.ReadToEnd() } finally { $reader.Dispose(); $stream.Dispose() }
            $path = Join-Path $env:RUNNER_TEMP $OutName
            [IO.File]::WriteAllText($path,$text,(New-Object Text.UTF8Encoding($false)))
            return $path
          }

          function Show-Function([string]$Path,[string]$FunctionName) {
            $text = [IO.File]::ReadAllText($Path)
            $pattern = '(?ms)^function\s+' + [regex]::Escape($FunctionName) + '\b.*?^}\s*$'
            $m = [regex]::Match($text,$pattern)
            if (-not $m.Success) { throw "Function not found: $FunctionName" }
            Write-Host "===== FUNCTION $FunctionName ====="
            Write-Host $m.Value
          }

          $engine = Read-Resource 'AotR8P.EngineScript' 'launcher_engine_113.ps1'
          Show-Function $engine 'New-LinkedFile'
          Show-Function $engine 'New-LinkedDirectory'
          Show-Function $engine 'Prepare-PortableModLayer'

          $gui = Read-Resource 'AotR8P.GuiScript' 'launcher_gui_113.ps1'
          Show-Function $gui 'Reset-PortableRuntime'
          Show-Function $gui 'Resolve-LauncherAotRRoot'
