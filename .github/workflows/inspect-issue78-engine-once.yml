name: Inspect Issue78 Engine Once

on:
  push:
    branches:
      - hotfix/external-drive-link-fallback
    paths:
      - .github/workflows/inspect-issue78-engine-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extract live embedded engine and show link logic
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path '.\AotR 8P WotR Mod.exe').Path
          $asm = [Reflection.Assembly]::LoadFile($exe)
          $stream = $asm.GetManifestResourceStream('AotR8P.EngineScript')
          if (-not $stream) { throw 'AotR8P.EngineScript resource missing' }
          $reader = New-Object IO.StreamReader($stream,[Text.Encoding]::UTF8,$true)
          try { $text = $reader.ReadToEnd() } finally { $reader.Dispose(); $stream.Dispose() }
          $path = Join-Path $env:RUNNER_TEMP 'launcher_engine_113.ps1'
          [IO.File]::WriteAllText($path,$text,(New-Object Text.UTF8Encoding($false)))
          $sha = (Get-FileHash -Algorithm SHA256 $path).Hash
          Write-Host "ENGINE_RESOURCE_SHA256=$sha"
          $lines = Get-Content -LiteralPath $path
          $hits = for ($i=0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match 'HardLink|SymbolicLink|New-Item.*ItemType|Copy-Item') { $i }
          }
          if (-not $hits) { throw 'No link/copy logic found in embedded engine' }
          foreach ($hit in ($hits | Select-Object -Unique)) {
            $start=[Math]::Max(0,$hit-12); $end=[Math]::Min($lines.Count-1,$hit+18)
            Write-Host "===== EXCERPT lines $($start+1)-$($end+1) ====="
            for ($j=$start; $j -le $end; $j++) { Write-Host ('{0:D4}: {1}' -f ($j+1),$lines[$j]) }
          }
