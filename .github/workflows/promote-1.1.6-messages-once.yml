name: Promote 1.1.6 Messages Once

on:
  push:
    branches:
      - hotfix/messages-unread-state
    paths:
      - '.github/workflows/promote-1.1.6-messages-once.yml'

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download, revalidate, and promote exact RC1 bytes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Net.Http

          $artifactId=9679589813
          $sourceRun=33155923650
          $expectedOuter='88349799FA9D20FC77F7F8F5EA6ECC41E9759CE2582005028E59FFEEF46C2B17'
          $expectedExe='E5FD1761FB84E452782AFD970225775CB55096C22628F1B9061344C282861431'
          $expectedGui='8A31D3EDC48B5915AC552EFB26DFF48CEABB1022D24C0A90834930117046A2AA'
          $expectedEngine='E9E2452FF56A66D57FF63C0B1654CFE0C856F4D5FA66C558E8F237C9ABABF641'
          $expectedInnerZip='871EAC9DEF6C4C0A5FF6CD368579C9BB08CE134E7E70673DE9F5B4573D8B060E'
          $expectedUi='827988C328E010A598BFAD16C9BFF830C3F904EAF1640F162C8124E8C6ABA376'
          $expectedPaper='3FF683843190A323DE9299C17DCD36AF24C5C00473119478E3FAF068BF904E43'

          $artifactZip=Join-Path $env:RUNNER_TEMP 'rc116-artifact.zip'
          $extract=Join-Path $env:RUNNER_TEMP 'rc116-artifact'
          $headers=@{
            Authorization="Bearer $env:GITHUB_TOKEN"
            Accept='application/vnd.github+json'
            'User-Agent'='AotR-8P-WotR-1.1.6-Promotion'
          }
          Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri "https://api.github.com/repos/eliaauditore/AotR-8P-WotR/actions/artifacts/$artifactId/zip" -OutFile $artifactZip
          $outer=(Get-FileHash -Algorithm SHA256 -LiteralPath $artifactZip).Hash
          if($outer -ne $expectedOuter){throw "Actions artifact digest mismatch: $outer"}
          Expand-Archive -LiteralPath $artifactZip -DestinationPath $extract -Force

          $package=Join-Path $extract 'package'
          if(-not (Test-Path -LiteralPath $package -PathType Container)){
            $found=Get-ChildItem -LiteralPath $extract -Recurse -File -Filter 'AotR 8P WotR Mod.exe' | Select-Object -First 1
            if(-not $found){throw 'candidate EXE not found in artifact'}
            $package=$found.Directory.FullName
          }
          $exe=Join-Path $package 'AotR 8P WotR Mod.exe'
          $manifestPath=Join-Path $package 'manifest.json'
          $repairPath=Join-Path $package 'repair-manifest.json'
          $uiPath=Join-Path $package 'payload_ui.big'
          $paperPath=Join-Path $package 'payload_paper.inc'
          foreach($p in @($exe,$manifestPath,$repairPath,$uiPath,$paperPath)){if(-not (Test-Path -LiteralPath $p -PathType Leaf)){throw "artifact package file missing: $p"}}

          $exeHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          if($exeHash -ne $expectedExe){throw "EXE hash mismatch: $exeHash"}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath $uiPath).Hash -ne $expectedUi){throw 'UI payload hash mismatch'}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath $paperPath).Hash -ne $expectedPaper){throw 'paper payload hash mismatch'}

          $inner=Get-ChildItem -LiteralPath $extract -Recurse -File -Filter '*.zip' | Select-Object -First 1
          if(-not $inner){throw 'inner release ZIP missing'}
          $innerHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $inner.FullName).Hash
          if($innerHash -ne $expectedInnerZip){throw "inner ZIP hash mismatch: $innerHash"}

          $defender=Get-ChildItem -LiteralPath $extract -Recurse -File -Filter 'DEFENDER_SCAN.txt' | Select-Object -First 1
          if(-not $defender -or (Get-Content -LiteralPath $defender.FullName -Raw).Trim() -ne 'SCANNED_CLEAN'){throw 'RC1 Defender gate is not SCANNED_CLEAN'}

          $manifest=Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $repair=Get-Content -LiteralPath $repairPath -Raw | ConvertFrom-Json
          if($manifest.launcher_version -ne '1.1.6'){throw 'manifest version mismatch'}
          if($manifest.launcher_sha256 -ne $expectedExe){throw 'manifest launcher hash mismatch'}
          if($repair.generated_for_launcher -ne '1.1.6'){throw 'repair manifest version mismatch'}

          # Re-test the exact embedded GUI from the downloaded EXE.
          $asm=[Reflection.Assembly]::Load([IO.File]::ReadAllBytes($exe))
          $guiStream=$asm.GetManifestResourceStream('AotR8P.GuiScript')
          $engineStream=$asm.GetManifestResourceStream('AotR8P.EngineScript')
          if(-not $guiStream -or -not $engineStream){throw 'embedded GUI/engine resource missing'}
          $gui=Join-Path $env:RUNNER_TEMP 'promotion-gui-116.ps1'
          $engine=Join-Path $env:RUNNER_TEMP 'promotion-engine-116.ps1'
          try{$o=[IO.File]::Create($gui);try{$guiStream.CopyTo($o)}finally{$o.Dispose()}}finally{$guiStream.Dispose()}
          try{$o=[IO.File]::Create($engine);try{$engineStream.CopyTo($o)}finally{$o.Dispose()}}finally{$engineStream.Dispose()}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath $gui).Hash -ne $expectedGui){throw 'embedded GUI hash mismatch'}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath $engine).Hash -ne $expectedEngine){throw 'embedded engine hash mismatch'}

          $tokens=$null;$errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($gui,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw "embedded GUI parse failed: $($errors[0].Message)"}
          $wanted=@{}
          foreach($n in @('Get-HttpText','Load-SupportState','Save-SupportState','Resolve-MasterIssue','Get-MaintainerMessages','Refresh-SupportMessages')){$wanted[$n]=$true}
          $funcs=@($ast.FindAll({param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $wanted.ContainsKey($node.Name)},$true))
          if($funcs.Count -ne 6){throw "MESSAGES function extraction mismatch: $($funcs.Count)"}
          $fn=Join-Path $env:RUNNER_TEMP 'promotion-message-functions.ps1'
          [IO.File]::WriteAllText($fn,(($funcs|ForEach-Object{$_.Extent.Text})-join "`r`n`r`n"),(New-Object Text.UTF8Encoding($false)))
          . $fn
          function Set-MessagesIndicator {}
          function Write-RepairLog([string]$Text){Write-Host "REPAIRLOG: $Text"}
          $script:HttpClient=New-Object System.Net.Http.HttpClient
          $script:HttpClient.Timeout=[TimeSpan]::FromSeconds(30)
          $script:HttpClient.DefaultRequestHeaders.UserAgent.ParseAdd('AotR-8P-WotR-Launcher/1.1.6-Promotion')
          $script:HttpClient.DefaultRequestHeaders.Accept.ParseAdd('application/vnd.github+json')
          $script:GitHubApiRoot='https://api.github.com/repos/eliaauditore/AotR-8P-WotR'
          $script:SupportStatePath=Join-Path $env:RUNNER_TEMP 'promotion-support-state.json'
          $seed=[ordered]@{schema=1;fingerprint='A8P-FP-53730198C7CD';master_issue=0;last_seen_message_id=0;latest_message_id=0;last_checked=''}
          [IO.File]::WriteAllText($script:SupportStatePath,($seed|ConvertTo-Json -Depth 4),(New-Object Text.UTF8Encoding($false)))
          $script:SupportState=$null
          $script:SupportState=Load-SupportState
          $messages=@(Refresh-SupportMessages)
          $master=[int]$script:SupportState['master_issue']
          $latest=[Int64]$script:SupportState['latest_message_id']
          $seen=[Int64]$script:SupportState['last_seen_message_id']
          if($master -ne 78){throw "promotion master lookup expected 78, got $master"}
          if($messages.Count -lt 2){throw "promotion expected at least 2 public maintainer messages, got $($messages.Count)"}
          if($latest -lt 5450084118){throw "promotion latest message too old: $latest"}
          if($seen -ne 0 -or $latest -le $seen){throw 'promotion unread invariant failed'}
          $null=@(Refresh-SupportMessages -MarkRead)
          if([Int64]$script:SupportState['last_seen_message_id'] -ne [Int64]$script:SupportState['latest_message_id']){throw 'promotion MarkRead invariant failed'}
          $script:HttpClient.Dispose()
          Write-Host 'PROMOTION_EXACT_MESSAGES_E2E=PASS'

          foreach($name in @('AotR 8P WotR Mod.exe','manifest.json','repair-manifest.json','payload_ui.big','payload_paper.inc')){
            Copy-Item -LiteralPath (Join-Path $package $name) -Destination (Join-Path (Get-Location) $name) -Force
          }

          $manifestSha=(Get-FileHash -Algorithm SHA256 -LiteralPath $manifestPath).Hash
          $repairSha=(Get-FileHash -Algorithm SHA256 -LiteralPath $repairPath).Hash
          $checkpoint=@(
            '# Launcher 1.1.6 release checkpoint','',
            '- Distribution: GitHub self-update channel only; no new ModDB package.',
            '- Root cause: Windows PowerShell 5.1 preserves the JSON comment array as one `System.Object[]` when `ConvertFrom-Json` is wrapped directly by `@(...)`; the first `[internal]` comment therefore caused the aggregate object to be filtered out.',
            '- Fix: parse comments first, then normalize with `@($parsedComments)` before filtering.',
            '- Source RC run: `'+$sourceRun+'`.',
            '- Source artifact ID: `'+$artifactId+'`.',
            '- Actions artifact SHA256: `'+$expectedOuter+'`.',
            '- Launcher SHA256: `'+$expectedExe+'`.',
            '- Launcher size: `'+(Get-Item -LiteralPath $exe).Length+'` bytes.',
            '- Embedded GUI SHA256: `'+$expectedGui+'`.',
            '- Embedded engine SHA256: `'+$expectedEngine+'`.',
            '- Release ZIP SHA256: `'+$expectedInnerZip+'`.',
            '- Manifest SHA256: `'+$manifestSha+'`.',
            '- Repair manifest SHA256: `'+$repairSha+'`.',
            '- Defender: `SCANNED_CLEAN`.',
            '- Exact embedded MESSAGES E2E: master #78 resolved, public maintainer messages loaded, `latest > seen` before open, persistence verified in RC gate, and MarkRead advanced seen to latest.',
            '',
            'The public candidate in this branch is copied from the exact tested Actions artifact; it is not rebuilt during promotion.'
          ) -join [Environment]::NewLine
          $checkpointPath='docs/release/LAUNCHER_1_1_6_RELEASE_CHECKPOINT.md'
          [IO.File]::WriteAllText($checkpointPath,$checkpoint+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f '.github/workflows/promote-1.1.6-messages-once.yml'
          git rm -f '.github/workflows/build-1.1.6-messages-rc.yml'
          git add -- 'AotR 8P WotR Mod.exe' 'manifest.json' 'repair-manifest.json' 'payload_ui.big' 'payload_paper.inc' $checkpointPath
          git commit -m 'Promote exact launcher 1.1.6 MESSAGES RC1'
          git push origin HEAD:hotfix/messages-unread-state
          Write-Host "PROMOTED_EXE_SHA256=$expectedExe"
