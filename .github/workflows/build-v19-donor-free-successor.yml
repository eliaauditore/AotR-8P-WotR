name: Build V19 Donor-Free Successor

on:
  push:
    branches:
      - feature/v19-donor-free-successor
    paths:
      - ".gitattributes"
      - "launcher-source/v19-successor/**"
      - "launcher-source/v19/launcher.cs"
      - "launcher-source/v19/VERIFY_V7_RESOURCE_CHAIN.ps1"
      - "payload_ui.big"
      - "payload_paper.inc"
      - "repair-manifest.json"
      - ".github/workflows/build-v19-donor-free-successor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-v19-donor-free-successor
    runs-on: windows-latest
    steps:
      - name: Checkout successor source
        uses: actions/checkout@v5

      - name: Static donor-free source boundary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $builder = '.\launcher-source\v19-successor\BUILD_LAUNCHER_DONOR_FREE_CANDIDATE.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($builder,[ref]$tokens,[ref]$errors)
          if (@($errors).Count -gt 0) {
              $errors | Format-List *
              throw 'Donor-free successor builder has parser errors.'
          }
          $params = @($ast.ParamBlock.Parameters | ForEach-Object { $_.Name.VariablePath.UserPath })
          if ($params -contains 'FrozenDonorRoot') { throw 'Successor builder still exposes FrozenDonorRoot.' }
          if ($params -notcontains 'OutputRoot' -or $params -notcontains 'LauncherVersion') {
              throw "Unexpected successor parameter surface: $($params -join ', ')"
          }
          $text = Get-Content -LiteralPath $builder -Raw
          foreach ($forbidden in @('ExtractAssociatedIcon','Get-ConstString','Inflate-Base64Gzip','Frozen 1.1.1 EXE')) {
              if ($text.Contains($forbidden)) { throw "Donor extraction primitive remains in successor builder: $forbidden" }
          }
          Write-Host "DONOR-FREE PARAMETER/EXTRACTION SURFACE PASS: $($params -join ', ')" -ForegroundColor Green

      - name: Build non-release successor from repository inputs only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'v19-donor-free-successor'
          & '.\launcher-source\v19-successor\BUILD_LAUNCHER_DONOR_FREE_CANDIDATE.ps1' `
              -OutputRoot $output `
              -LauncherVersion '1.1.3-donorfree-dev1'

          $reportPath = Join-Path $output 'DONOR_FREE_BUILD_REPORT.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Donor-free build report missing.' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.state -ne 'NON_RELEASE_DONOR_FREE_CANDIDATE') { throw "Unexpected report state: $($report.state)" }
          if ($report.launcher_version -ne '1.1.3-donorfree-dev1') { throw "Unexpected candidate version: $($report.launcher_version)" }
          if ($report.frozen_donor_root_used -ne $false) { throw 'Report indicates a donor root was used.' }
          if ($report.frozen_production_exe_sha256 -ne '5B4D12B7BF43D72860E27C51A3D8AC7AC00CA53DB58499E41AC735F7B7ECED0E') {
              throw 'Frozen 1.1.2 comparison identity changed.'
          }
          "### V19 donor-free successor" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- version: ``$($report.launcher_version)``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- EXE SHA256: ``$($report.candidate_exe_sha256)``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- donor root used: ``$($report.frozen_donor_root_used)``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- frozen 1.1.2 untouched comparison: ``$($report.frozen_production_exe_sha256)``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Prove repository was not mutated by build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            echo "Build mutated the checked-out repository." >&2
            exit 1
          fi
          echo "Repository remained clean after donor-free build."

      - name: Upload non-release candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: v19-donor-free-successor-dev1
          path: |
            ${{ runner.temp }}/v19-donor-free-successor/package/**
            ${{ runner.temp }}/v19-donor-free-successor/SHA256SUMS.json
            ${{ runner.temp }}/v19-donor-free-successor/DONOR_FREE_BUILD_REPORT.json
            ${{ runner.temp }}/v19-donor-free-successor/*.zip
            ${{ runner.temp }}/v19-donor-free-successor/*.sha256.txt
          if-no-files-found: error
          retention-days: 30
