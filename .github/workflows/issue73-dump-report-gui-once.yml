name: Issue73 Dump Report GUI Once

on:
  push:
    branches:
      - feature/accountless-direct-report
    paths:
      - ".github/workflows/issue73-dump-report-gui-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/accountless-direct-report
          fetch-depth: 1

      - name: Checkout frozen 1.1.1 donor
        uses: actions/checkout@v5
        with:
          ref: v1.1.1
          path: donor-v1.1.1
          fetch-depth: 1

      - name: Build current transformed resources
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          .\launcher-source\v19\BUILD_LAUNCHER_1_1_2_CLEAN_CANDIDATE.ps1 `
            -FrozenDonorRoot .\donor-v1.1.1 `
            -OutputRoot .\_ISSUE73_INSPECT `
            -LauncherVersion 1.1.2

      - name: Print exact report panel blocks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='.\_ISSUE73_INSPECT\work\resources\launcher_gui.ps1'
          $lines=Get-Content -LiteralPath $p -Encoding UTF8
          foreach($range in @(@(1170,1232),@(1928,2030),@(2300,2325))){
            Write-Host ('===== LINES {0}-{1} =====' -f $range[0],$range[1])
            for($n=$range[0];$n -le $range[1];$n++){
              Write-Host ('{0:D5}: {1}' -f $n,$lines[$n-1])
            }
          }
