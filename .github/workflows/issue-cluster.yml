name: Master Ticket Broadcast

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Broadcast maintainer master-ticket replies
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const comment = context.payload.comment;
            const issuePayload = context.payload.issue;
            const allowedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);

            if (issuePayload.pull_request) return;
            if (!allowedAssociations.has(comment.author_association)) {
              core.info("Comment is not from a maintainer; no broadcast.");
              return;
            }
            if ((comment.body || "").includes("<!-- no-broadcast -->") || /^\s*\[internal\]/i.test(comment.body || "")) {
              core.info("Maintainer opted this comment out of broadcast.");
              return;
            }

            const { data: master } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issuePayload.number
            });
            const labels = (master.labels || []).map(label => typeof label === "string" ? label : label.name);
            if (!labels.includes("master-ticket")) {
              core.info("Comment is not on a master ticket; no broadcast.");
              return;
            }

            const fingerprintMatch = (master.body || "").match(/\bA8P-FP-[A-F0-9]{12}\b/i);
            if (!fingerprintMatch) {
              core.info("Master ticket has no fingerprint; no broadcast.");
              return;
            }

            const fingerprint = fingerprintMatch[0].toUpperCase();
            const ticketId = number => `A8P-TICKET-${String(number).padStart(4, "0")}`;
            const extractFingerprint = text => {
              const match = (text || "").match(/\bA8P-FP-[A-F0-9]{12}\b/i);
              return match ? match[0].toUpperCase() : null;
            };

            const allItems = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100
            });
            const members = allItems
              .filter(item => !item.pull_request)
              .filter(item => item.number !== master.number)
              .filter(item => extractFingerprint(item.body) === fingerprint);

            const marker = `<!-- a8p-master-broadcast:${comment.id} -->`;
            const masterUrl = `https://github.com/${owner}/${repo}/issues/${master.number}`;
            const mirroredBody = [
              marker,
              `### Update from ${ticketId(master.number)}`,
              comment.body,
              "",
              `Master ticket: ${masterUrl}`
            ].join("\n");

            let mirrored = 0;
            for (const member of members) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: member.number,
                per_page: 100
              });
              if (comments.some(existing => (existing.body || "").includes(marker))) continue;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: member.number,
                body: mirroredBody
              });
              mirrored += 1;
            }

            const asksForRetest = /\brecheck\b|\bretest\b|should be fixed|please test again|please verify/i.test(comment.body || "");
            if (asksForRetest) {
              const targets = [master, ...members];
              for (const target of targets) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: target.number,
                  labels: ["needs-retest"]
                });
              }
            }

            core.info(`Broadcast master comment ${comment.id} to ${mirrored} clustered report(s).`);
