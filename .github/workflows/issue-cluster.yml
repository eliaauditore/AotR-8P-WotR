name: Master Ticket Clustering

on:
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: a8p-issue-processing
  cancel-in-progress: false

jobs:
  cluster:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Cluster reports by support fingerprint
        uses: actions/github-script@v8
        with:
          script: |
            const crypto = require("crypto");
            const { owner, repo } = context.repo;

            const clusterLabels = {
              "master-ticket": ["6f42c1", "Canonical issue for one support fingerprint/error cluster"],
              "cluster-member": ["bfd4f2", "Individual report linked to a master ticket"],
              "needs-retest": ["fef2c0", "Maintainer asked affected players to verify a proposed fix"]
            };

            for (const [name, [color, description]] of Object.entries(clusterLabels)) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            const ticketId = number => `A8P-TICKET-${String(number).padStart(4, "0")}`;
            const labelNames = item => (item.labels || []).map(label => typeof label === "string" ? label : label.name);
            const resolveFingerprint = text => {
              const source = text || "";
              const direct = source.match(/\bA8P-FP-[A-F0-9]{12}\b/i);
              if (direct) return direct[0].toUpperCase();

              const errorCodeMatch = source.match(/\bA8P-(?!FP-)[A-Z0-9]+(?:-[A-Z0-9]+)*-[0-9]{3}\b/i);
              const errorSectionMatch = source.match(/###\s+(?:Exact error(?: \/ visible state)?|Exact error message|Original error)\s*\n+([\s\S]*?)(?=\n###\s|\s*$)/i);
              if (!errorCodeMatch || !errorSectionMatch) return null;

              const normalizedError = errorSectionMatch[1]
                .replace(/```(?:text)?/gi, "")
                .replace(/```/g, "")
                .trim()
                .toLowerCase()
                .replace(/\s+/g, " ");
              if (!normalizedError) return null;

              const signature = `${errorCodeMatch[0].toUpperCase()}|${normalizedError}`;
              return `A8P-FP-${crypto.createHash("sha256").update(signature, "utf8").digest("hex").slice(0, 12).toUpperCase()}`;
            };

            const removeLabel = async (issueNumber, label) => {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };

            const upsertBlock = (body, start, end, block) => {
              const source = body || "";
              const startIndex = source.indexOf(start);
              const endIndex = source.indexOf(end);
              if (startIndex !== -1 && endIndex !== -1 && endIndex >= startIndex) {
                return `${source.slice(0, startIndex)}${block}${source.slice(endIndex + end.length)}`;
              }
              return `${source.trimEnd()}\n\n${block}\n`;
            };

            const { data: current } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: context.payload.issue.number
            });

            if (current.pull_request) return;

            const fingerprint = resolveFingerprint(current.body);
            if (!fingerprint) {
              core.info("No stable support fingerprint can be resolved for this issue.");
              return;
            }

            const allItems = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100
            });

            let candidates = allItems
              .filter(item => !item.pull_request)
              .filter(item => resolveFingerprint(item.body) === fingerprint);

            if (!candidates.some(item => item.number === current.number)) {
              candidates.push(current);
            }

            const existingMasters = candidates
              .filter(item => labelNames(item).includes("master-ticket"))
              .sort((a, b) => a.number - b.number);

            const master = existingMasters[0] || [...candidates].sort((a, b) => a.number - b.number)[0];
            const masterId = ticketId(master.number);
            const masterUrl = `https://github.com/${owner}/${repo}/issues/${master.number}`;

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: master.number,
              labels: ["master-ticket"]
            });
            await removeLabel(master.number, "cluster-member");
            await removeLabel(master.number, "duplicate");

            for (const extraMaster of existingMasters.slice(1)) {
              await removeLabel(extraMaster.number, "master-ticket");
            }

            if (
              master.state === "closed" &&
              current.number !== master.number &&
              current.state === "open" &&
              ["opened", "reopened"].includes(context.payload.action)
            ) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: master.number,
                state: "open"
              });
              await removeLabel(master.number, "fixed");
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: master.number,
                labels: ["needs-triage"]
              });
            }

            candidates = [...candidates].sort((a, b) => a.number - b.number);

            const clusterRows = candidates.map(item => {
              const role = item.number === master.number ? " **MASTER**" : " report";
              return `- \`${ticketId(item.number)}\` — #${item.number}${role}`;
            });

            const clusterStart = "<!-- a8p-cluster-start -->";
            const clusterEnd = "<!-- a8p-cluster-end -->";
            const clusterBlock = [
              clusterStart,
              "### Error cluster",
              `- **Master:** \`${masterId}\` (#${master.number})`,
              `- **Fingerprint:** \`${fingerprint}\``,
              `- **Affected reports:** ${candidates.length}`,
              "",
              ...clusterRows,
              clusterEnd
            ].join("\n");

            const { data: freshMaster } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: master.number
            });
            const newMasterBody = upsertBlock(freshMaster.body, clusterStart, clusterEnd, clusterBlock);
            if (newMasterBody !== (freshMaster.body || "")) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: master.number,
                body: newMasterBody
              });
            }

            if (candidates.length >= 2) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: master.number,
                labels: ["confirmed"]
              });
            }

            for (const item of candidates) {
              if (item.number === master.number) continue;

              const { data: child } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: item.number
              });

              const linkStart = "<!-- a8p-master-link-start -->";
              const linkEnd = "<!-- a8p-master-link-end -->";
              const linkBlock = [
                linkStart,
                `> Clustered under master **${masterId}**: ${masterUrl}`,
                `> Fingerprint: \`${fingerprint}\`. Maintainer updates from the master are mirrored to this report.`,
                linkEnd
              ].join("\n");

              const newChildBody = upsertBlock(child.body, linkStart, linkEnd, linkBlock);
              if (newChildBody !== (child.body || "")) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: child.number,
                  body: newChildBody
                });
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: child.number,
                labels: ["cluster-member", "duplicate"]
              });
              await removeLabel(child.number, "master-ticket");
              await removeLabel(child.number, "needs-triage");

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: child.number,
                per_page: 100
              });

              if (!comments.some(comment => (comment.body || "").includes("<!-- a8p-cluster-link -->"))) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: child.number,
                  body: [
                    "<!-- a8p-cluster-link -->",
                    `This report is part of the same error class as **${masterId}** (#${master.number}).`,
                    `All maintainer updates on the master ticket will be mirrored here automatically.`,
                    `Master: ${masterUrl}`
                  ].join("\n\n")
                });
              }

              if (child.state !== "closed") {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: child.number,
                  state: "closed"
                });
              }

              await removeLabel(child.number, "needs-triage");
            }

            core.info(`Cluster ${fingerprint}: master ${masterId}, ${candidates.length} affected report(s).`);

  broadcast:
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Broadcast maintainer master-ticket replies
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const comment = context.payload.comment;
            const issuePayload = context.payload.issue;
            const allowedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);

            if (issuePayload.pull_request) return;
            if (!allowedAssociations.has(comment.author_association)) {
              core.info("Comment is not from a maintainer; no broadcast.");
              return;
            }
            if ((comment.body || "").includes("<!-- no-broadcast -->") || /^\s*\[internal\]/i.test(comment.body || "")) {
              core.info("Maintainer opted this comment out of broadcast.");
              return;
            }

            const { data: master } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issuePayload.number
            });
            const labels = (master.labels || []).map(label => typeof label === "string" ? label : label.name);
            if (!labels.includes("master-ticket")) {
              core.info("Comment is not on a master ticket; no broadcast.");
              return;
            }

            const fingerprintMatch = (master.body || "").match(/\bA8P-FP-[A-F0-9]{12}\b/i);
            if (!fingerprintMatch) {
              core.info("Master ticket has no fingerprint; no broadcast.");
              return;
            }
            const fingerprint = fingerprintMatch[0].toUpperCase();
            const ticketId = number => `A8P-TICKET-${String(number).padStart(4, "0")}`;
            const extractFingerprint = text => {
              const match = (text || "").match(/\bA8P-FP-[A-F0-9]{12}\b/i);
              return match ? match[0].toUpperCase() : null;
            };

            const allItems = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100
            });
            const members = allItems
              .filter(item => !item.pull_request)
              .filter(item => item.number !== master.number)
              .filter(item => extractFingerprint(item.body) === fingerprint);

            const marker = `<!-- a8p-master-broadcast:${comment.id} -->`;
            const masterUrl = `https://github.com/${owner}/${repo}/issues/${master.number}`;
            const mirroredBody = [
              marker,
              `### Update from ${ticketId(master.number)}`,
              comment.body,
              "",
              `Master ticket: ${masterUrl}`
            ].join("\n");

            let mirrored = 0;
            for (const member of members) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: member.number,
                per_page: 100
              });
              if (comments.some(existing => (existing.body || "").includes(marker))) continue;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: member.number,
                body: mirroredBody
              });
              mirrored += 1;
            }

            const asksForRetest = /\brecheck\b|\bretest\b|should be fixed|please test again|please verify/i.test(comment.body || "");
            if (asksForRetest) {
              const targets = [master, ...members];
              for (const target of targets) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: target.number,
                  labels: ["needs-retest"]
                });
              }
            }

            core.info(`Broadcast master comment ${comment.id} to ${mirrored} clustered report(s).`);
